name: CI — Traiteur Dupont Agent v2

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/traiteur-agent

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install ruff==0.8.0
      - run: ruff check etape_02_vocal_agent_prod_rgpd/src/
        working-directory: ${{ github.workspace }}

  # ── 2. Tests unitaires ───────────────────────────────────────────────────────
  unit-tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etape_02_vocal_agent_prod_rgpd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      - name: Tests unitaires (sans réseau, < 30 s)
        run: pytest tests/ -m "not slow" -v --timeout=30
        env:
          GROQ_API_KEY: "dummy_key_for_tests"
          LLM_PROVIDER: "groq"
          STT_PROVIDER: "groq"

  # ── 3. Build Docker ──────────────────────────────────────────────────────────
  docker-build:
    name: Build image Docker
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    defaults:
      run:
        working-directory: etape_02_vocal_agent_prod_rgpd
    steps:
      - uses: actions/checkout@v5
      - name: Build image agent
        run: docker build -t traiteur-agent:${{ github.sha }} .

  # ── 4. Tests de prompts (promptfoo) ─────────────────────────────────────────
  prompt-tests:
    name: Tests de prompts (promptfoo)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: etape_02_vocal_agent_prod_rgpd
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Démarrer l'agent en mode test
        run: |
          cp .env.example .env
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          echo "STT_PROVIDER=groq" >> .env
          echo "LLM_PROVIDER=groq" >> .env
          docker compose up -d agent tts
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 5
          done
      - name: Installer promptfoo
        run: npm install -g promptfoo@0.103.5
      - name: Lancer le golden set
        run: promptfoo eval --config tests/promptfoo.yaml --output results.json
      - name: Vérifier le seuil de 90 %
        run: |
          python3 -c "
          import json, sys
          results = json.load(open('results.json'))
          passed = sum(1 for r in results.get('results', {}).get('results', []) if r.get('success'))
          total  = len(results.get('results', {}).get('results', []))
          rate   = passed / total if total > 0 else 0
          print(f'Résultats promptfoo : {passed}/{total} ({rate:.0%})')
          if rate < 0.9:
              print('ECHEC : taux inférieur au seuil de 90 %')
              sys.exit(1)
          "
      - name: Arrêter les services
        if: always()
        run: docker compose down

  # ── 5. Tests de conversation (uniquement sur PR vers main et tag) ────────────
  conversation-tests:
    name: Tests de conversation complets
    runs-on: ubuntu-latest
    needs: prompt-tests
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: etape_02_vocal_agent_prod_rgpd
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Démarrer l'agent
        run: |
          cp .env.example .env
          echo "GROQ_API_KEY=$GROQ_API_KEY" >> .env
          docker compose up -d agent tts
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 5
          done
      - name: Tests lents (conversations LLM réelles)
        run: |
          pip install -r requirements.txt
          pytest tests/test_conversations.py -m slow -v --timeout=120
        env:
          TEST_AGENT_URL: "http://localhost:8000"
      - name: Arrêter les services
        if: always()
        run: docker compose down

  # ── 6. Release Docker (sur tag v*.*.*) ───────────────────────────────────────
  docker-release:
    name: Push image GHCR
    runs-on: ubuntu-latest
    needs: [unit-tests, docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: etape_02_vocal_agent_prod_rgpd
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Build et push image versionnée
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} .
          docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
