  <text x="924" y="343" font-size="11" font-weight="600" fill="#1565C0">💳 CB payé</text>
  <!-- Badge statut -->
  <rect x="1076" y="328" width="86" height="22" rx="11" fill="#E8F5E9"/>
  <text x="1086" y="343" font-size="11" font-weight="600" fill="#2E7D32">✅ Confirmée</text>

  <!-- Row 2 — Sur place -->
  <rect x="41" y="356" width="1198" height="1" fill="#EEEEEE"/>
  <text x="64" y="384" font-size="12" font-family="monospace" fill="#757575">D4E5F6</text>
