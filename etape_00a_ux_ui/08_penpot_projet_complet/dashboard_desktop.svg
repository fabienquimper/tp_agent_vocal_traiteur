  <text x="1086" y="427" font-size="11" font-weight="600" fill="#E65100">⏳ En attente</text>

  <!-- Row 4 — CB ok -->
  <rect x="41" y="440" width="1198" height="1" fill="#EEEEEE"/>
  <text x="64" y="468" font-size="12" font-family="monospace" fill="#757575">J1K2L3</text>
  <text x="140" y="468" font-size="13" fill="#212121">12:05</text>
  <text x="220" y="468" font-size="13" fill="#212121">Moreau Claire</text>
  <text x="400" y="468" font-size="13" fill="#212121">06 11 22 33 44</text>
  <text x="530" y="468" font-size="12" fill="#212121">Quiche lorraine ×3, Salade ×2</text>
  <text x="820" y="468" font-size="13" font-weight="600" fill="#212121">87,00 €</text>
  <!-- Badge CB payé -->
  <rect x="916" y="454" width="86" height="22" rx="11" fill="#E3F2FD"/>
  <text x="924" y="469" font-size="11" font-weight="600" fill="#1565C0">💳 CB payé</text>
  <!-- Badge statut -->
  <rect x="1076" y="454" width="86" height="22" rx="11" fill="#E8F5E9"/>
  <text x="1086" y="469" font-size="11" font-weight="600" fill="#2E7D32">✅ Confirmée</text>

  <!-- Row 5 — En cours -->
  <rect x="41" y="482" width="1198" height="1" fill="#EEEEEE"/>
  <text x="64" y="510" font-size="12" font-family="monospace" fill="#757575">M4N5O6</text>
  <text x="140" y="510" font-size="13" fill="#212121">11:30</text>
  <text x="220" y="510" font-size="13" fill="#212121">Petit Thomas</text>
  <text x="400" y="510" font-size="13" fill="#212121">07 22 33 44 55</text>
  <text x="530" y="510" font-size="12" fill="#212121">Tarte aux pommes ×2</text>
  <text x="820" y="510" font-size="13" font-weight="600" fill="#212121">40,00 €</text>
