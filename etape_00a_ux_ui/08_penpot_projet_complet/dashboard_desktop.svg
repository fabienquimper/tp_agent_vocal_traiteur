  <text x="920" y="298" font-size="12" font-weight="700" fill="#424242">PAIEMENT</text>
  <text x="1080" y="298" font-size="12" font-weight="700" fill="#424242">STATUT</text>

  <!-- Row 1 — CB ok -->
  <rect x="41" y="314" width="1198" height="1" fill="#EEEEEE"/>
  <text x="64" y="342" font-size="12" font-family="monospace" fill="#757575">A1B2C3</text>
  <text x="140" y="342" font-size="13" fill="#212121">14:32</text>
  <text x="220" y="342" font-size="13" fill="#212121">Martin Sophie</text>
  <text x="400" y="342" font-size="13" fill="#212121">06 12 34 56 78</text>
  <text x="530" y="342" font-size="12" fill="#212121">Bœuf bourguignon ×1</text>
  <text x="820" y="342" font-size="13" font-weight="600" fill="#212121">48,00 €</text>
  <!-- Badge CB payé -->
