  <rect x="910" y="146" width="6" height="100" rx="3" fill="#2E7D32"/>
  <text x="938" y="178" font-size="12" fill="#757575" font-weight="600">CHIFFRE D'AFFAIRES</text>
  <text x="938" y="218" font-size="36" font-weight="700" fill="#2E7D32">1 248 €</text>

  <!-- ── ORDERS TABLE ────────────────────────────────────────────── -->
  <rect x="40" y="270" width="1200" height="500" rx="12" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>

  <!-- Table header -->
  <rect x="40" y="270" width="1200" height="44" rx="12" fill="#F5F5F5"/>
  <rect x="40" y="290" width="1200" height="24" fill="#F5F5F5"/>
  <!-- Fix rounded corners for bottom of header -->
  <rect x="41" y="312" width="1198" height="2" fill="#EEEEEE"/>

  <text x="64" y="298" font-size="12" font-weight="700" fill="#424242">RÉF.</text>
