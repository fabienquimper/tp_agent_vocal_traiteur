<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Page background -->
  <rect width="1280" height="800" fill="#F5F5F0"/>

  <!-- ── HEADER ────────────────────────────────────────────────── -->
  <rect x="0" y="0" width="1280" height="64" fill="#2E7D32"/>

  <!-- Logo + title -->
  <text x="24" y="42" font-size="26" fill="#FFFFFF">🍽️</text>
  <text x="60" y="34" font-size="18" font-weight="700" fill="#FFFFFF">Traiteur Dupont</text>
  <text x="60" y="52" font-size="12" fill="rgba(255,255,255,0.85)">Tableau de bord — Commandes</text>

  <!-- Nav links right -->
