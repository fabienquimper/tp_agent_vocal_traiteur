  <text x="64" y="426" font-size="12" font-family="monospace" fill="#757575">G7H8I9</text>
  <text x="140" y="426" font-size="13" fill="#212121">12:48</text>
  <text x="220" y="426" font-size="13" fill="#212121">Bernard Lucas</text>
  <text x="400" y="426" font-size="13" fill="#212121">06 55 44 33 22</text>
