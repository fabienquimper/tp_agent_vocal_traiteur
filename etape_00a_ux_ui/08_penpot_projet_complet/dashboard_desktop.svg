  <text x="1220" y="38" font-size="14" fill="#FFFFFF" font-weight="600">📋 Dashboard</text>
  <circle cx="1255" cy="52" r="5" fill="#69F0AE"/>
  <text x="1165" y="56" font-size="11" fill="rgba(255,255,255,0.75)">Service en ligne</text>

  <!-- ── PAGE TITLE ─────────────────────────────────────────────── -->
  <text x="40" y="106" font-size="22" font-weight="700" fill="#212121">Commandes du jour</text>
  <text x="40" y="126" font-size="13" fill="#757575">Mise à jour automatique toutes les 30 secondes</text>

  <!-- ── STAT CARDS ─────────────────────────────────────────────── -->

  <!-- Card 1 : Total commandes -->
  <rect x="40" y="146" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1" filter="url(#shadow)"/>
  <rect x="40" y="146" width="6" height="100" rx="3" fill="#2E7D32"/>
  <text x="68" y="178" font-size="12" fill="#757575" font-weight="600">COMMANDES TOTALES</text>
  <text x="68" y="218" font-size="36" font-weight="700" fill="#212121">12</text>
  <text x="130" y="218" font-size="13" fill="#757575">commandes</text>

  <!-- Card 2 : Payées CB -->
  <rect x="330" y="146" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="330" y="146" width="6" height="100" rx="3" fill="#1565C0"/>
  <text x="358" y="178" font-size="12" fill="#757575" font-weight="600">PAYÉES PAR CB</text>
  <text x="358" y="218" font-size="36" font-weight="700" fill="#1565C0">8</text>
  <text x="406" y="218" font-size="13" fill="#757575">validées</text>

  <!-- Card 3 : Sur place -->
  <rect x="620" y="146" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="620" y="146" width="6" height="100" rx="3" fill="#FF8F00"/>
  <text x="648" y="178" font-size="12" fill="#757575" font-weight="600">PAIEMENT SUR PLACE</text>
  <text x="648" y="218" font-size="36" font-weight="700" fill="#FF8F00">3</text>
  <text x="696" y="218" font-size="13" fill="#757575">à régler</text>

  <!-- Card 4 : Chiffre d'affaires -->
