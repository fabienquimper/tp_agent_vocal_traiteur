  <text x="924" y="511" font-size="11" font-weight="600" fill="#2E7D32">⌛ En attente CB</text>
  <!-- Badge statut -->
  <rect x="1076" y="496" width="86" height="22" rx="11" fill="#E3F2FD"/>
  <text x="1086" y="511" font-size="11" font-weight="600" fill="#1565C0">🔄 En cours</text>

  <!-- Ellipsis rows -->
  <text x="620" y="546" font-size="20" fill="#BDBDBD" text-anchor="middle">• • •</text>
  <text x="640" y="546" font-size="14" fill="#BDBDBD" text-anchor="middle">• • •</text>
  <text x="620" y="546" font-size="14" fill="#BDBDBD">• • •  7 autres commandes</text>

  <!-- Footer / pagination info -->
  <rect x="41" y="740" width="1198" height="1" fill="#EEEEEE"/>
  <text x="64" y="760" font-size="12" fill="#757575">Affichage de 5 / 12 commandes</text>
  <text x="1100" y="760" font-size="12" fill="#2E7D32" font-weight="600">↓ Exporter en Excel</text>

  <!-- Drop shadow filter -->
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

</svg>
