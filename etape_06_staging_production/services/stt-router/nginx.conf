# ─────────────────────────────────────────────────────────────────────────────
# Configuration nginx — STT Router
#
# Ce fichier inclut /etc/nginx/upstream.conf qui définit l'upstream actif.
# Pour switcher de blue à green :
#   1. cp /etc/nginx/upstreams/green.conf /etc/nginx/upstream.conf
#   2. nginx -s reload  → graceful switch, aucune requête perdue
#
# Pourquoi nginx pour le Blue/Green ?
#   nginx -s reload recharge la config sans couper les connexions actives :
#   - les requêtes en cours sont terminées sur l'ancien upstream (blue)
#   - les nouvelles requêtes partent sur le nouvel upstream (green)
#   - le switch prend < 100ms
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 512;
}

http {
    # Inclut la définition de l'upstream actif (blue ou green)
    # Ce fichier est remplacé lors du switch Blue/Green
    include /etc/nginx/upstream.conf;

    # Logs au format standard pour faciliter le débogage
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8001;
        server_name _;

        # Timeout pour les requêtes de transcription (qui peuvent durer plusieurs secondes)
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        proxy_connect_timeout 10s;

        # Taille max des fichiers audio uploadés (50 Mo)
        client_max_body_size 50m;

        # Headers proxy standards (bonne pratique)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Toutes les requêtes sont proxiées vers l'upstream actif
        location / {
            proxy_pass http://stt_active;
        }
    }
}
