# ─────────────────────────────────────────────────────────────────────────────
# kind-config.yaml — Cluster Kubernetes local (kind)
# Étape 11 : Canary Release (NGINX Ingress + traffic splitting)
#
# kind (Kubernetes IN Docker) crée un cluster K8s complet dans des conteneurs
# Docker. C'est le standard pour tester K8s en local.
#
# Usage :
#   kind create cluster --config kind-config.yaml
#   kind delete cluster --name traiteur
#
# extraPortMappings :
#   Permet d'accéder aux services K8s depuis localhost.
#   containerPort = NodePort K8s sur le "nœud" kind
#   hostPort      = port sur votre machine
# ─────────────────────────────────────────────────────────────────────────────
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: traiteur

nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30000   # agent API
        hostPort: 8000
        protocol: TCP
      - containerPort: 30080   # UI web
        hostPort: 3000
        protocol: TCP
      - containerPort: 30090   # Prometheus
        hostPort: 9090
        protocol: TCP
      - containerPort: 30031   # Grafana
        hostPort: 3001
        protocol: TCP
      - containerPort: 30434   # Ollama (pour make k8s-init-ollama)
        hostPort: 11434
        protocol: TCP
      - containerPort: 30081   # ArgoCD UI (étape 09 — GitOps)
        hostPort: 8080
        protocol: TCP
      - containerPort: 30686   # Jaeger UI (étape 10 — Traces distribuées)
        hostPort: 16686
        protocol: TCP
      - containerPort: 80     # NGINX Ingress HTTP (étape 11 — Canary)
        hostPort: 8081
        protocol: TCP
      - containerPort: 443    # NGINX Ingress HTTPS (étape 11 — Canary)
        hostPort: 8443
        protocol: TCP
