# ─────────────────────────────────────────────────────────────────────────────
# pyproject.toml — Traiteur Dupont Agent Vocal
# Étape 08 : CI/CD — configuration des outils de qualité
#
# Deux outils configurés ici :
#   - ruff  : linter Python ultra-rapide (remplace flake8 + isort + pyupgrade)
#   - pytest : framework de tests
#
# Ces fichiers sont lus automatiquement par les outils sans arguments supplémentaires.
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
# Longueur de ligne — 120 est plus permissif que PEP 8 (79) mais raisonnable
line-length = 120

# Dossiers à exclure du linting
exclude = [
    ".git",
    ".github",
    "__pycache__",
    "*.egg-info",
    ".venv",
    "venv",
]

[tool.ruff.lint]
# Règles activées :
#   E  = pycodestyle errors (espaces, indentation)
#   F  = pyflakes (imports non utilisés, variables non définies)
#   I  = isort (ordre des imports)
#   W  = pycodestyle warnings
select = ["E", "F", "I", "W"]

# Règles ignorées :
#   E501 = ligne trop longue (géré par line-length ci-dessus)
#   F401 = import non utilisé dans __init__.py (pratique courante pour les re-exports)
ignore = ["E501", "F401"]

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
# Répertoire racine des tests
testpaths = ["tests"]

# Affichage : verbose + traceback court + couleurs
addopts = "-v --tb=short"

# Markers personnalisés (évite les warnings "unknown marker")
markers = [
    "unit: tests unitaires purs (pas de services externes)",
    "integration: tests d'intégration (nécessitent Docker ou K8s)",
    "slow: tests lents (> 5s)",
]
