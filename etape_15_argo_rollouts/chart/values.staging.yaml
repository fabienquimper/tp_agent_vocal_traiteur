# ─────────────────────────────────────────────────────────────────────────────
# values.staging.yaml — Surcharges pour l'environnement staging
#
# Usage :
#   helm install traiteur-staging ./chart \
#     -f values.staging.yaml \
#     --namespace traiteur-staging \
#     --create-namespace
#
# Principe : ne redéfinir QUE ce qui diffère des défauts.
# Tout ce qui n'est pas ici hérite de values.yaml.
# ─────────────────────────────────────────────────────────────────────────────

namespace: traiteur-staging

agent:
  replicaCount: 1          # staging n'a pas besoin de 2 replicas

  env:
    appEnv: staging          # /health retourne "env": "staging"
    ragQualityThreshold: "0.7"  # seuil moins strict en staging
    otelTracesEnabled: "true"

  hpa:
    enabled: false           # pas de HPA en staging (1 replica fixe)
    minReplicas: 1
    maxReplicas: 1

ollama:
  enabled: true              # même Ollama qu'en prod

monitoring:
  prometheus:
    enabled: true
    retention: 1d            # moins de rétention en staging

  grafana:
    enabled: false           # pas de Grafana en staging (économise de la RAM)

tracing:
  jaeger:
    enabled: true
    maxTraces: 1000          # moins de traces en staging

alerting:
  enabled: true
  webhookUrl: "http://host.docker.internal:5001/alerts"  # webhook local en staging
  slack:
    enabled: false

# SLOs plus souples en staging (on s'autorise plus d'erreurs)
slos:
  availability:
    target: "0.95"           # 95% en staging vs 99% en prod
  latency:
    p95TargetSeconds: "15.0" # 15s en staging vs 8s en prod
  ragHitRate:
    target: "0.70"           # 70% en staging vs 80% en prod
