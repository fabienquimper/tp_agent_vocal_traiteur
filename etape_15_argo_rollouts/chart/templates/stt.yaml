{{/*
stt.yaml — Blue/Green Whisper + Router nginx
La couleur active est contrôlée par .Values.stt.activeColor ("blue" ou "green").
Changer la couleur sans redéployer : helm upgrade --set stt.activeColor=green
*/}}

# ── STT Blue ──────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-blue
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    app: stt
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt
      color: blue
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        app: stt
        color: blue
    spec:
      containers:
        - name: stt
          image: traiteur-stt:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: WHISPER_MODEL
              value: {{ .Values.stt.blue.model | quote }}
          resources:
            {{- toYaml .Values.stt.blue.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: {{ .Values.stt.blue.readinessProbe.initialDelaySeconds }}
            periodSeconds: 20
            failureThreshold: 12

---
# ── STT Green ─────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-green
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    app: stt
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt
      color: green
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        app: stt
        color: green
    spec:
      containers:
        - name: stt
          image: traiteur-stt:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: WHISPER_MODEL
              value: {{ .Values.stt.green.model | quote }}
          resources:
            {{- toYaml .Values.stt.green.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: {{ .Values.stt.green.readinessProbe.initialDelaySeconds }}
            periodSeconds: 20
            failureThreshold: 12

---
# ── Service STT Router — pointe vers la couleur active ────────────────────────
{{/*
MAGIE HELM : le sélecteur change selon .Values.stt.activeColor
  helm upgrade traiteur ./chart --set stt.activeColor=green
  → Le Service stt-router pointe maintenant vers les pods "green"
  → Équivalent de `kubectl patch service stt-router -p '{"spec":{"selector":{"color":"green"}}}'`
  → Mais avec Helm, c'est déclaratif et versionné dans Git !
*/}}
apiVersion: v1
kind: Service
metadata:
  name: stt-router
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
  annotations:
    helm.sh/active-color: {{ .Values.stt.activeColor | quote }}
spec:
  selector:
    app: stt
    color: {{ .Values.stt.activeColor }}   # ← "blue" ou "green" selon values
  ports:
    - port: 8001
      targetPort: 8001

---
# Services directs (pour benchmark/debug)
apiVersion: v1
kind: Service
metadata:
  name: stt-blue
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: stt
    color: blue
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30011

---
apiVersion: v1
kind: Service
metadata:
  name: stt-green
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    app: stt
    color: green
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30012
