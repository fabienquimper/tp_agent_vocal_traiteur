{{/*
network-policies.yaml — Politique réseau Zero Trust
Conditionnel : {{ if .Values.security.networkPolicies.enabled }}
En CI : security.networkPolicies.enabled=false → aucune politique créée.

Comparer avec k8s/security/network-policies.yaml (YAML brut étape 12) :
  Avant : namespace: traiteur  (hardcodé partout)
  Après : namespace: {{ .Values.namespace }}

  Avant : fichier unique, toujours appliqué
  Après : bloc conditionnel — désactivable en un flag pour le debug ou la CI

Note importante — CNI et kind :
  kind utilise kindnet qui ne supporte pas les NetworkPolicies.
  Le script security-setup.sh installe kube-network-policies (kubernetes-sigs).
  En production : Calico, Cilium ou Antrea fournissent ce support nativement.
*/}}

{{- if .Values.security.networkPolicies.enabled }}
# ── 1. Default Deny All — Zero Trust baseline ─────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
  annotations:
    security.traiteur/purpose: "Zero Trust — tout bloqué par défaut"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# ── 2. Allow DNS — critique, sans ça aucun nom de service ne résout ───────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ── 3. Agent — ingress depuis nginx/prometheus/ui ; egress vers ollama/stt/tts/jaeger
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: ui
      ports:
        - protocol: TCP
          port: 8000
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - podSelector:
            matchLabels:
              app: stt
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: tts
      ports:
        - protocol: TCP
          port: 8002
    {{- if .Values.tracing.jaeger.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    {{- end }}

---
{{- if .Values.canary.enabled }}
# ── Agent Canary — mêmes règles que l'agent stable ────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-canary
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: agent-canary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - podSelector:
            matchLabels:
              app: stt
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: tts
      ports:
        - protocol: TCP
          port: 8002
    {{- if .Values.tracing.jaeger.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
      ports:
        - protocol: TCP
          port: 4317
    {{- end }}
---
{{- end }}

# ── 4. Services ML — uniquement depuis l'agent ────────────────────────────────
{{- if .Values.ollama.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
        - podSelector:
            matchLabels:
              app: agent-canary
      ports:
        - protocol: TCP
          port: 11434

---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stt
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: stt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
        - podSelector:
            matchLabels:
              app: agent-canary
      ports:
        - protocol: TCP
          port: 8001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tts
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: tts
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
        - podSelector:
            matchLabels:
              app: agent-canary
      ports:
        - protocol: TCP
          port: 8002

---
# ── 5. Monitoring ─────────────────────────────────────────────────────────────
{{- if .Values.monitoring.prometheus.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
    - ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 11434

---
{{- end }}
{{- if .Values.monitoring.grafana.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    {{- if .Values.tracing.jaeger.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
      ports:
        - protocol: TCP
          port: 16686
    {{- end }}

---
{{- end }}
# ── 6. Jaeger — reçoit les traces OTLP, expose UI ────────────────────────────
{{- if .Values.tracing.jaeger.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jaeger
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - ports:
        - protocol: TCP
          port: 16686
{{- end }}
{{- end }}
