# ─────────────────────────────────────────────────────────────────────────────
# values.ci.yaml — Surcharges pour le pipeline CI/CD (GitHub Actions)
#
# Objectifs CI :
#   - RAM limitée (7 GB sur les runners) → désactiver Ollama réel (4 GB)
#   - Pas de monitoring (économise RAM + temps de démarrage)
#   - Agent seul + mock-ollama + STT + TTS
#
# Usage dans le pipeline CD (cd.yml) :
#   helm install traiteur ./chart -f values.ci.yaml --namespace traiteur
# ─────────────────────────────────────────────────────────────────────────────

namespace: traiteur

agent:
  replicaCount: 1
  image:
    pullPolicy: Never          # images chargées via kind load

  env:
    appEnv: ci
    otelTracesEnabled: "false"  # pas de Jaeger en CI

  hpa:
    enabled: false

ollama:
  # En CI, on remplace Ollama (4.5 GB) par le mock (~50 MB)
  # Le mock est déployé séparément via k8s/ci/mock-ollama.yaml
  enabled: false

monitoring:
  prometheus:
    enabled: false   # pas de monitoring en CI
  grafana:
    enabled: false

tracing:
  jaeger:
    enabled: false   # pas de tracing en CI

security:
  networkPolicies:
    enabled: false   # simplifie le debug en CI

alerting:
  enabled: false     # pas d'AlertManager en CI (économise RAM + ports)
