# ─────────────────────────────────────────────────────────────────────────────
# network-policies.yaml — Politique réseau Zero Trust
# Étape 12 : Sécurité
#
# Philosophie : Default Deny + Allow explicite
#
#   Sans NetworkPolicy → tous les pods peuvent communiquer librement
#   Avec NetworkPolicy → seuls les flux explicitement autorisés fonctionnent
#
# FLUX AUTORISÉS dans notre application :
#
#   [nginx-ingress] ──8000──▶ [agent]
#   [agent]         ──11434─▶ [ollama]
#   [agent]         ──8001──▶ [stt]
#   [agent]         ──8002──▶ [tts]
#   [agent]         ──4317──▶ [jaeger]   (OTLP traces)
#   [prometheus]    ──8000──▶ [agent]    (métriques /metrics)
#   [grafana]       ──9090──▶ [prometheus]
#   [ui]            ──8000──▶ [agent]    (appels API)
#   tous            ──53───▶ [kube-dns] (résolution DNS — CRITIQUE)
#
# FLUX BLOQUÉS (Zero Trust) :
#   [ollama] ──▶ [agent]      (Ollama ne devrait jamais initier de connexion)
#   [agent]  ──▶ [grafana]    (pas de raison métier)
#   [agent]  ──▶ API K8s      (sauf via son ServiceAccount, port 443)
#   tout     ──▶ internet     (pas d'accès sortant arbitraire)
#
# NOTE IMPORTANTE — CNI et kind :
#   kind utilise "kindnet" par défaut, qui ne supporte PAS les NetworkPolicies.
#   Ce script installe "kube-network-policies" (kubernetes-sigs) qui ajoute
#   le support des NetworkPolicies à kindnet via un userspace controller.
#   En production, Calico, Cilium ou Antrea fournissent ce support nativement.
# ─────────────────────────────────────────────────────────────────────────────

# ══════════════════════════════════════════════════════════════════════════════
# 1. Default Deny All — la règle fondamentale du Zero Trust
#
# podSelector: {} = s'applique à TOUS les pods du namespace traiteur
# Sans règles d'allow explicites, aucun pod ne peut communiquer.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: traiteur
  annotations:
    security.traiteur/purpose: "Zero Trust baseline — tout est bloqué par défaut"
spec:
  podSelector: {}   # tous les pods du namespace
  policyTypes:
    - Ingress
    - Egress
  # Aucune règle = tout bloqué

---
# ══════════════════════════════════════════════════════════════════════════════
# 2. Allow DNS — DOIT être appliqué avant tout le reste
#
# Sans cette règle, les pods ne peuvent pas résoudre "ollama", "stt", etc.
# Tous les pods ont besoin du DNS pour fonctionner.
#
# kube-dns tourne dans le namespace kube-system sur le port 53 UDP+TCP.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: traiteur
  annotations:
    security.traiteur/purpose: "DNS résolution — sans ça, aucun service name ne résout"
spec:
  podSelector: {}   # tous les pods
  policyTypes:
    - Egress
  egress:
    - to:
        # kube-dns est dans kube-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ══════════════════════════════════════════════════════════════════════════════
# 3. Agent — politique complète (ingress + egress)
#
# Ingress (qui peut appeler l'agent) :
#   - NGINX Ingress Controller (namespace ingress-nginx) → route les requêtes externes
#   - Prometheus (namespace traiteur) → scrape /metrics
#   - UI (namespace traiteur) → appels API
#
# Egress (vers qui l'agent peut appeler) :
#   - Ollama :11434 → inférences LLM
#   - STT :8001     → transcription audio
#   - TTS :8002     → synthèse vocale
#   - Jaeger :4317  → export de traces OTLP
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent
  namespace: traiteur
  annotations:
    security.traiteur/purpose: "Règles réseau de l'agent IA"
spec:
  podSelector:
    matchLabels:
      app: agent   # s'applique aussi à agent-canary via labelSelector séparé
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # ── Depuis NGINX Ingress Controller ────────────────────────────────────
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000

    # ── Depuis Prometheus (scrape métriques) ───────────────────────────────
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000

    # ── Depuis UI (appels API) ─────────────────────────────────────────────
    - from:
        - podSelector:
            matchLabels:
              app: ui
      ports:
        - protocol: TCP
          port: 8000

    # ── Accès direct NodePort (développement local, kubectl port-forward) ─
    # Note : en production on supprimerait cette règle pour forcer le passage par l'ingress
    - ports:
        - protocol: TCP
          port: 8000

  egress:
    # ── Vers Ollama (LLM inférences) ───────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434

    # ── Vers STT (transcription audio) ────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: stt
      ports:
        - protocol: TCP
          port: 8001

    # ── Vers TTS (synthèse vocale) ─────────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: tts
      ports:
        - protocol: TCP
          port: 8002

    # ── Vers Jaeger (traces OTLP gRPC) ────────────────────────────────────
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318

---
# Agent canary : mêmes règles que l'agent stable
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agent-canary
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: agent-canary
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8000
    - ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: ollama
      ports:
        - protocol: TCP
          port: 11434
    - to:
        - podSelector:
            matchLabels:
              app: stt
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: tts
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
      ports:
        - protocol: TCP
          port: 4317

---
# ══════════════════════════════════════════════════════════════════════════════
# 4. Services internes — peuvent répondre sur leurs ports
#
# Ollama, STT, TTS : peuvent recevoir des requêtes depuis l'agent uniquement.
# Ne peuvent PAS initier de connexion sortante (sauf DNS).
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ollama
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: ollama
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
        - podSelector:
            matchLabels:
              app: agent-canary
      ports:
        - protocol: TCP
          port: 11434

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-stt
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: stt
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
        - podSelector:
            matchLabels:
              app: agent-canary
      ports:
        - protocol: TCP
          port: 8001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tts
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: tts
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent
        - podSelector:
            matchLabels:
              app: agent-canary
      ports:
        - protocol: TCP
          port: 8002

---
# ══════════════════════════════════════════════════════════════════════════════
# 5. Monitoring — Prometheus peut scraper tous les pods + Grafana → Prometheus
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - protocol: TCP
          port: 9090
    - ports:
        - protocol: TCP
          port: 9090
  egress:
    # Prometheus peut scraper TOUS les pods du namespace sur le port 8000
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 11434

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app: jaeger
      ports:
        - protocol: TCP
          port: 16686

---
# ══════════════════════════════════════════════════════════════════════════════
# 6. Jaeger — reçoit les traces (OTLP), expose l'UI
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jaeger
  namespace: traiteur
spec:
  podSelector:
    matchLabels:
      app: jaeger
  policyTypes:
    - Ingress
  ingress:
    # Recevoir les traces OTLP (depuis agent)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    # UI accessible depuis l'extérieur (NodePort)
    - ports:
        - protocol: TCP
          port: 16686
