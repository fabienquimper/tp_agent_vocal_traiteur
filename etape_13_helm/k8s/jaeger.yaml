# ─────────────────────────────────────────────────────────────────────────────
# Jaeger — Backend de traces distribuées (K8s)
# Étape 10 : OpenTelemetry
#
# jaegertracing/all-in-one : collecteur + stockage + UI en un seul pod.
# Pour la production, on séparerait en Deployment séparés
# (jaeger-collector, jaeger-query, elasticsearch/cassandra pour le stockage).
#
# Ports :
#   4317  → OTLP gRPC (reçoit les spans depuis l'agent)
#   4318  → OTLP HTTP (alternatif)
#   16686 → UI Jaeger (accessible via NodePort sur localhost:16686)
# ─────────────────────────────────────────────────────────────────────────────

# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: traiteur
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16686   # UI
            - containerPort: 4317    # OTLP gRPC
            - containerPort: 4318    # OTLP HTTP
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: "5000"   # limité en K8s (moins de RAM disponible)
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 15
            periodSeconds: 30

---
# ── Service ClusterIP — accès interne (agent → jaeger OTLP) ──────────────────
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: traiteur
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686

---
# ── Service NodePort — UI Jaeger accessible depuis l'hôte ────────────────────
# kind-config.yaml doit avoir le port mapping :
#   containerPort: 30686  hostPort: 16686
# (À ajouter dans kind-config.yaml si kind-config.yaml n'a pas ce port)
apiVersion: v1
kind: Service
metadata:
  name: jaeger-external
  namespace: traiteur
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
