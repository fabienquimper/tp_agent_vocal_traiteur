# ── Blue/Green Deployment STT — version Kubernetes ────────────────────────────
#
# En K8s, le Blue/Green est plus élégant qu'avec nginx :
# On a DEUX Deployments (blue + green) et UN Service qui pointe vers l'un ou l'autre
# via son "selector" (filtre sur les labels des pods).
#
# Switch :
#   kubectl patch service stt-router -n traiteur \
#     -p '{"spec":{"selector":{"app":"stt","color":"green"}}}'
#
# Avantages vs nginx (étape 03) :
#   - Pas de config nginx à modifier manuellement
#   - Atomique : K8s met à jour le selector en une opération
#   - Visible : kubectl describe service stt-router montre le selector actif
#
# ── STT Blue (Whisper base) — actif par défaut ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-blue
  namespace: traiteur
  labels:
    app: stt
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt
      color: blue
  template:
    metadata:
      labels:
        app: stt
        color: blue
    spec:
      containers:
        - name: stt
          image: traiteur-stt:latest
          imagePullPolicy: Never     # image chargée via kind load
          ports:
            - containerPort: 8001
          env:
            - name: WHISPER_MODEL
              value: "base"
            - name: WHISPER_DEVICE
              value: "cpu"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 10

---
# ── STT Green (Whisper small) — candidat au déploiement ──────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-green
  namespace: traiteur
  labels:
    app: stt
    color: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt
      color: green
  template:
    metadata:
      labels:
        app: stt
        color: green
    spec:
      containers:
        - name: stt
          image: traiteur-stt:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8001
          env:
            - name: WHISPER_MODEL
              value: "small"
            - name: WHISPER_DEVICE
              value: "cpu"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 90   # Whisper small prend plus de temps à charger
            periodSeconds: 20
            failureThreshold: 10

---
# ── Service stt-router — pointe vers blue par défaut ─────────────────────────
# Pour switcher : kubectl patch service stt-router -n traiteur \
#   -p '{"spec":{"selector":{"app":"stt","color":"green"}}}'
apiVersion: v1
kind: Service
metadata:
  name: stt-router
  namespace: traiteur
  annotations:
    traiteur/active-color: "blue"   # annotation informative — mise à jour par k8s-stt-switch.sh
spec:
  selector:
    app: stt
    color: blue   # ← LA CLÉ DU BLUE/GREEN : changer "blue" ↔ "green"
  ports:
    - port: 8001
      targetPort: 8001
