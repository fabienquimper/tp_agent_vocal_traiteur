{{/*
tracing.yaml — Jaeger (backend OpenTelemetry)
Conditionnel : {{ if .Values.tracing.jaeger.enabled }}
En CI : tracing.jaeger.enabled=false → aucune ressource Jaeger créée.

Comparer avec k8s/jaeger.yaml (YAML brut étape 10) :
  Avant : MEMORY_MAX_TRACES: "5000"  (hardcodé)
  Après : {{ .Values.tracing.jaeger.maxTraces }}  (10000 en prod, 1000 en staging)

Le pod agent détecte la présence de Jaeger via l'env OTEL_EXPORTER_OTLP_ENDPOINT
injectée dans agent.yaml :
  {{- if .Values.tracing.jaeger.enabled }}
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://jaeger:4317"
  {{- end }}
*/}}

{{- if .Values.tracing.jaeger.enabled }}
# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    {{- include "traiteur.selectorLabels" "jaeger" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "traiteur.selectorLabels" "jaeger" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        {{- include "traiteur.selectorLabels" "jaeger" | nindent 8 }}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16686   # UI
            - containerPort: 4317    # OTLP gRPC
            - containerPort: 4318    # OTLP HTTP
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: MEMORY_MAX_TRACES
              value: {{ .Values.tracing.jaeger.maxTraces | quote }}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 15
            periodSeconds: 30

---
# ── Service ClusterIP — OTLP interne (agent → jaeger) ─────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "traiteur.selectorLabels" "jaeger" | nindent 4 }}
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: ui
      port: 16686
      targetPort: 16686

---
# ── Service NodePort — UI Jaeger accessible depuis l'hôte ─────────────────────
apiVersion: v1
kind: Service
metadata:
  name: jaeger-external
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "traiteur.selectorLabels" "jaeger" | nindent 4 }}
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
{{- end }}
