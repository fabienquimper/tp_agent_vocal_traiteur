# ─────────────────────────────────────────────────────────────────────────────
# agent-canary.yaml — Déploiement Canary de l'agent
# Étape 11 : Canary Release
#
# Ce fichier déploie la VERSION CANDIDATE (nouvelle version à tester).
# Il coexiste avec agent.yaml (version stable) dans le même namespace.
#
# Différences vs agent.yaml :
#   name: agent-canary    (pas "agent")
#   labels: version=canary
#   replicas: 1           (canary = petit volume)
#   APP_ENV: canary       → /health retourne "env": "canary"
#   OLLAMA_BASE_URL: intentionnellement cassé pour la démo rollback
#     → voir scripts/canary-setup.sh --broken pour le démo d'échec
#
# Comment le trafic est distribué :
#   NGINX Ingress (ingress.yaml) → 90% vers Service "agent" (stable)
#                                → 10% vers Service "agent-canary" (canary)
#   Le Service "agent-canary" route vers CE pod.
#
# Pour simuler une "vraie" nouvelle version :
#   - Changer l'image (ex: traiteur-agent:v2)
#   - Changer une env var (ex: LLM_MODEL=llama2)
#   - En prod, le CI buildrait un nouveau tag et l'injecterait ici
# ─────────────────────────────────────────────────────────────────────────────

# ── Deployment Canary ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-canary
  namespace: traiteur
  labels:
    app: agent-canary
    version: canary
  annotations:
    # Trace la version candidate — visible dans kubectl describe
    canary.traiteur/deployed-at: "auto"
    canary.traiteur/purpose: "canary deployment — trafic partiel avant promotion"
spec:
  # 1 seul replica : le canary reçoit peu de trafic (~10%)
  # Ne pas scale le canary : ça augmenterait son % de trafic via round-robin
  replicas: 1
  selector:
    matchLabels:
      app: agent-canary
  template:
    metadata:
      labels:
        app: agent-canary
        version: canary
    spec:
      containers:
        - name: agent
          # Même image que le stable — en prod, ce serait traiteur-agent:v2
          image: traiteur-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: traiteur-config
          env:
            # ── Marqueur canary ─────────────────────────────────────────────
            # APP_ENV=canary → /health retourne {"env":"canary"}
            # Permet au canary-loadgen.sh de distinguer les réponses stable/canary
            - name: APP_ENV
              value: "canary"
            # ── Variable de version candidate ────────────────────────────────
            # En production, injectée par le CI (ex: CANARY_VERSION=1.2.3-rc1)
            - name: CANARY_VERSION
              value: "v2-candidate"
            # ── Pour la démo d'échec (optionnel) ─────────────────────────────
            # Décommenter pour simuler une version cassée :
            # - name: OLLAMA_BASE_URL
            #   value: "http://nonexistent-ollama:11434"
          volumeMounts:
            - name: data-vol
              mountPath: /app/data
              readOnly: true
            - name: eval-vol
              mountPath: /app/eval
              readOnly: true
            - name: chroma-vol
              mountPath: /app/chroma
            - name: orders-vol
              mountPath: /app/orders
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data-vol
          configMap:
            name: traiteur-data
        - name: eval-vol
          configMap:
            name: traiteur-eval
        - name: chroma-vol
          emptyDir: {}
        - name: orders-vol
          emptyDir: {}

---
# ── Service Canary ────────────────────────────────────────────────────────────
# Service dédié au canary — NGINX Ingress y envoie le % de trafic configuré.
# Sélecteur strict : app=agent-canary uniquement (pas de contamination avec stable).
apiVersion: v1
kind: Service
metadata:
  name: agent-canary
  namespace: traiteur
  labels:
    app: agent-canary
spec:
  selector:
    app: agent-canary   # sélectionne UNIQUEMENT les pods canary
  ports:
    - port: 8000
      targetPort: 8000
