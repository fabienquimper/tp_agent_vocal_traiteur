# ─────────────────────────────────────────────────────────────────────────────
# Override GPU NVIDIA – à combiner avec docker-compose.yml
# Activé automatiquement par le Makefile si nvidia-container-cli est disponible
#
# Prérequis : nvidia-container-toolkit installé + CDI configuré
#   Voir README.md section "GPU NVIDIA"
#
# Méthode : runtime: nvidia + NVIDIA_VISIBLE_DEVICES
#   (évite le hook Docker qui ignore config.toml et plante en mode legacy)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Ollama utilise automatiquement le GPU via nvidia-container-runtime (CDI)
  ollama:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  # STT (faster-whisper) : reste en CPU (image python:3.11-slim sans CUDA)
  # Pour GPU, il faudrait une image base nvidia/cuda - hors scope de ce TP
