# ─────────────────────────────────────────────────────────────────────────────
# CI Pipeline — Traiteur Dupont Agent Vocal
# Étape 08 : CI/CD
#
# Ce pipeline s'exécute à chaque push et pull request.
#
# Stratégie "fail fast" :
#   1. lint         → 30s  — détecte les erreurs de syntaxe/style avant tout
#   2. unit-tests   → 60s  — logique métier pure, sans Docker
#   3. docker-build → 5min — valide que les Dockerfiles buildent correctement
#   4. security     → 3min — scan Trivy des images (CVE critiques/hautes)
#
# Chaque job dépend du précédent (needs:) : si le lint échoue, on ne lance pas
# les tests. Si les tests échouent, on ne build pas. Économie de ressources CI.
#
# Concept "shift left" :
#   Détecter les problèmes le plus tôt possible dans le pipeline,
#   quand ils sont les moins chers à corriger.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: ["main", "develop", "feature/**"]
  pull_request:
    branches: ["main"]

# Annule les runs précédents sur la même branche (économie de ressources)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # Job 1 : Lint
  # Vérifie la qualité syntaxique du code Python.
  # ruff est ~100x plus rapide que flake8 (écrit en Rust).
  # ══════════════════════════════════════════════════════════════════════════
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff — check syntax and imports
        run: |
          ruff check services/agent/app/ tests/test_unit.py
          echo "✓ Lint passed"

      - name: Run ruff — check formatting
        run: |
          ruff format --check services/agent/app/ tests/test_unit.py
          echo "✓ Format OK"

  # ══════════════════════════════════════════════════════════════════════════
  # Job 2 : Tests unitaires
  # Tests purs Python, sans Docker, sans Ollama, sans ChromaDB.
  # Exécution en < 30 secondes.
  #
  # Ces tests s'appuient sur :
  #   - tests/test_unit.py  → logique métier (_detect_payment_method, etc.)
  # ══════════════════════════════════════════════════════════════════════════
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (agent)
        working-directory: services/agent
        run: |
          pip install -r requirements.txt -q

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio -q

      - name: Run unit tests
        run: |
          python -m pytest tests/test_unit.py -v --tb=short
          echo "✓ Unit tests passed"

  # ══════════════════════════════════════════════════════════════════════════
  # Job 3 : Docker Build
  # Valide que tous les Dockerfiles compilent correctement.
  # N'exécute PAS les conteneurs — uniquement le build.
  #
  # Pourquoi valider le build séparément ?
  #   Un Dockerfile cassé bloque TOUT le déploiement.
  #   Le détecter en CI (2 min) est bien préférable à le découvrir en prod.
  # ══════════════════════════════════════════════════════════════════════════
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image
        uses: docker/build-push-action@v5
        with:
          context: services/agent
          push: false
          tags: traiteur-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build STT image
        uses: docker/build-push-action@v5
        with:
          context: services/stt
          push: false
          tags: traiteur-stt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build TTS image
        uses: docker/build-push-action@v5
        with:
          context: services/tts
          push: false
          tags: traiteur-tts:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build UI image
        uses: docker/build-push-action@v5
        with:
          context: ui
          push: false
          tags: traiteur-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "✓ All Docker images build successfully"

  # ══════════════════════════════════════════════════════════════════════════
  # Job 4 : Security Scan (Trivy)
  # Scanne les images pour les CVE (Common Vulnerabilities and Exposures).
  # Trivy est l'outil de référence CNCF pour la sécurité des conteneurs.
  #
  # Stratégie :
  #   - CRITICAL + HIGH → bloquant (le build échoue)
  #   - MEDIUM + LOW    → informatif (ne bloque pas, mais visible)
  #
  # "Shift left security" : détecter les vulnérabilités AVANT le déploiement.
  # ══════════════════════════════════════════════════════════════════════════
  security:
    name: "Security Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agent image for scan
        uses: docker/build-push-action@v5
        with:
          context: services/agent
          push: false
          tags: traiteur-agent:scan
          load: true
          cache-from: type=gha

      - name: Run Trivy — scan image agent
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "traiteur-agent:scan"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Trivy — scan filesystem (dépendances Python)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "services/agent"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Summary
        if: success()
        run: echo "✓ No CRITICAL or HIGH vulnerabilities found"
