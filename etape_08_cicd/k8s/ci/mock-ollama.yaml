# ─────────────────────────────────────────────────────────────────────────────
# mock-ollama.yaml — Manifeste K8s pour le mock Ollama (CI uniquement)
#
# Remplace ollama.yaml en CI/CD pour économiser la RAM (7 GB sur GitHub runners).
#
# Différences avec ollama.yaml :
#   - Image : mock-ollama:ci (Python ~50 MB) vs ollama/ollama:latest (~4 GB)
#   - imagePullPolicy: Never  → image chargée via kind load (pas de registry)
#   - Resources: 50m CPU / 64Mi RAM  vs  500m CPU / 2 Gi RAM
#   - readinessProbe: HTTP GET /  vs  exec ollama list
#   - Pas de PVC (pas de modèles à persister)
#
# Le Service reste identique (nom "ollama", port 11434)
# → l'agent n'a pas besoin de savoir qu'il parle au mock.
# ─────────────────────────────────────────────────────────────────────────────

# ── Deployment ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: traiteur
  labels:
    app: ollama
    variant: mock   # différencie du vrai Ollama dans les logs/métriques
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        variant: mock
    spec:
      containers:
        - name: ollama
          image: mock-ollama:ci
          imagePullPolicy: Never   # image chargée via kind load — jamais depuis registry
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 15

---
# ── Service ClusterIP — même nom que prod (agent → ollama transparent) ────────
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: traiteur
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434

---
# ── Service NodePort — accès depuis l'hôte (pour debug CI) ───────────────────
apiVersion: v1
kind: Service
metadata:
  name: ollama-external
  namespace: traiteur
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 30434
