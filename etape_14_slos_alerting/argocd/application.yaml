# ─────────────────────────────────────────────────────────────────────────────
# ArgoCD Application — traiteur
#
# Une Application ArgoCD = la relation entre :
#   Source Git → k8s/ directory de ce dépôt
#   Destination → namespace "traiteur" du cluster local
#
# IMPORTANT : Ce fichier contient un placeholder REPO_URL.
#             Il est remplacé automatiquement par scripts/argocd-setup.sh.
#             Ne pas appliquer ce fichier directement avec kubectl.
#             Utiliser : make argocd-setup REPO_URL=https://github.com/...
#
# ── syncPolicy.automated ─────────────────────────────────────────────────────
#   prune: true     → supprime les ressources K8s absentes du dépôt Git
#   selfHeal: true  → RESTAURE toute modification manuelle (kubectl edit, etc.)
#
# C'est le principe fondamental de GitOps :
#   Git est la SEULE source de vérité.
#   Toute modification hors de Git est une "dérive" (drift).
#   ArgoCD la détecte et la corrige automatiquement.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traiteur
  namespace: argocd
  labels:
    app.kubernetes.io/name: traiteur
    app.kubernetes.io/managed-by: argocd
  # finalizer : empêche la suppression accidentelle (ArgoCD déprovisionne d'abord)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Projet ArgoCD (scoping des permissions)
  project: traiteur

  # ── Source : dépôt Git ───────────────────────────────────────────────────────
  source:
    repoURL: REPO_URL          # remplacé par argocd-setup.sh
    targetRevision: main       # branche suivie (peut être un tag ou un SHA)
    path: k8s                  # dossier dans le dépôt contenant les manifestes

    # Optionnel — si on utilise Kustomize ou Helm :
    # kustomize: {}
    # helm:
    #   valueFiles: [values.yaml]

  # ── Destination : cluster K8s ─────────────────────────────────────────────
  destination:
    server: https://kubernetes.default.svc   # cluster dans lequel ArgoCD tourne
    namespace: traiteur

  # ── Politique de synchronisation ──────────────────────────────────────────
  syncPolicy:
    automated:
      prune: true       # Supprime ce qui n'est plus dans Git
      selfHeal: true    # Restaure les dérives (modifications manuelles)

    syncOptions:
      - CreateNamespace=true    # Crée le namespace s'il n'existe pas
      - PrunePropagationPolicy=foreground  # Attend la suppression effective

    # Retry : réessaie si le sync échoue (ex: pod qui démarre lentement)
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # ── Exclusions : fichiers à ne PAS gérer (overlay CI, mock) ───────────────
  ignoreDifferences:
    # Les HPA modifient le nombre de replicas — ArgoCD ne doit pas écraser
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # géré par HPA, pas par Git
