# ─────────────────────────────────────────────────────────────────────────────
# values.yaml — Configuration par défaut
# Étape 13 : Helm
#
# Ce fichier contient TOUTES les valeurs configurables du chart.
# C'est la "documentation vivante" de ce qui peut être modifié.
#
# Ordre de priorité (du plus fort au plus faible) :
#   1. --set agent.replicaCount=5  (CLI, écrase tout)
#   2. -f values.prod.yaml          (fichier de surcharge)
#   3. ce fichier values.yaml       (défauts)
#
# Philosophie :
#   Les défauts doivent fonctionner pour un développeur local (kind).
#   Les fichiers values.*.yaml adaptent pour staging/prod/ci.
# ─────────────────────────────────────────────────────────────────────────────

# ── Namespace ──────────────────────────────────────────────────────────────────
namespace: traiteur

# ── Agent IA (LangGraph + RAG + FastAPI) ─────────────────────────────────────
agent:
  replicaCount: 2

  image:
    repository: traiteur-agent
    tag: latest
    pullPolicy: Never    # kind : images chargées via kind load

  env:
    appEnv: production   # "staging" | "production" | "canary"
    llmModel: mistral
    ragQualityThreshold: "0.8"
    orderComplexityThreshold: "6"
    otelTracesEnabled: "true"

  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

  # HPA (Horizontal Pod Autoscaler)
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    cpuUtilization: 50   # % d'utilisation CPU cible

  serviceAccount:
    name: agent-sa        # défini dans rbac.yaml

  # Probes (délais longs : ChromaDB rebuild ~60-90s)
  readinessProbe:
    initialDelaySeconds: 90
    periodSeconds: 15
    failureThreshold: 10

  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 30
    failureThreshold: 3

# ── Ollama (LLM local) ────────────────────────────────────────────────────────
ollama:
  enabled: true

  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent

  model: mistral   # modèle téléchargé par make k8s-init-ollama

  storage: 10Gi    # PVC pour les modèles (~4 GB pour Mistral 7B)

  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 20

# ── STT — Blue/Green Whisper ──────────────────────────────────────────────────
stt:
  blue:
    model: base     # Whisper base (~150 MB, rapide)
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "2Gi"
    readinessProbe:
      initialDelaySeconds: 120

  green:
    model: small    # Whisper small (~500 MB, plus précis)
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2000m"
        memory: "3Gi"
    readinessProbe:
      initialDelaySeconds: 180

  # Couleur active : "blue" ou "green"
  # Changer la couleur = changer le sélecteur du Service stt-router
  activeColor: blue

# ── TTS (Piper Text-to-Speech) ────────────────────────────────────────────────
tts:
  image:
    repository: traiteur-tts
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"

# ── UI Web ────────────────────────────────────────────────────────────────────
ui:
  enabled: true
  image:
    repository: traiteur-ui
    tag: latest
    pullPolicy: Never

# ── Monitoring ────────────────────────────────────────────────────────────────
monitoring:
  prometheus:
    enabled: true
    retention: 7d

  grafana:
    enabled: true
    adminPassword: admin   # À changer en production ! (ou via --set)

# ── Tracing (OpenTelemetry + Jaeger) ─────────────────────────────────────────
tracing:
  jaeger:
    enabled: true
    maxTraces: 10000

# ── Canary (désactivé par défaut) ─────────────────────────────────────────────
# Activer avec : helm upgrade traiteur ./chart --set canary.enabled=true
canary:
  enabled: false
  weight: 10   # % du trafic vers le canary (via NGINX Ingress annotation)
  env:
    appEnv: canary
    ollama:
      baseUrl: ""  # vide = même Ollama que stable

# ── Alerting (AlertManager) ───────────────────────────────────────────────────
alerting:
  enabled: true

  # Webhook local pour tests (scripts/alert-demo.sh démarre un serveur sur :5001)
  webhookUrl: "http://host.docker.internal:5001/alerts"

  slack:
    enabled: false
    webhookUrl: ""       # https://hooks.slack.com/services/T.../B.../...
    channel: "#alertes-traiteur"

# ── SLOs (Service Level Objectives) ──────────────────────────────────────────
# Ces valeurs sont injectées dans les règles d'alerte Prometheus via Helm.
# Modifier un SLO ici → helm upgrade → règles PromQL automatiquement mises à jour.
#
# Error budget mensuel = (1 - target) × 30j × 24h × 60m
#   availability 0.99 → 432 min d'erreurs autorisées par mois
slos:
  availability:
    target: "0.99"

  latency:
    p95TargetSeconds: "8.0"
    p99TargetSeconds: "20.0"

  ragHitRate:
    target: "0.80"

# ── Sécurité (Network Policies + RBAC) ───────────────────────────────────────
security:
  networkPolicies:
    enabled: true   # false = désactive les NetworkPolicies (debug uniquement)
  rbac:
    create: true    # false = utiliser des SA existants
