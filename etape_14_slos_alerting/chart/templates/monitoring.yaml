{{/*
monitoring.yaml — Prometheus + Grafana
Étape 14 : ajout de rule_files + alerting pour AlertManager

Conditionnels :
  {{ if .Values.monitoring.prometheus.enabled }}
  {{ if .Values.monitoring.grafana.enabled }}

Nouveautés étape 14 :
  - prometheus.yml : section rule_files (charge /etc/prometheus/rules/*.yml)
  - prometheus.yml : section alerting (pointe vers AlertManager si activé)
  - Prometheus Deployment : volume "rules" monté depuis ConfigMap "prometheus-alerts"
    (défini dans alerting.yaml)
*/}}

{{- if .Values.monitoring.prometheus.enabled }}
# ── Prometheus ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s   # fréquence d'évaluation des règles d'alerte

    # ── Règles d'alerte ────────────────────────────────────────────────────────
    # Prometheus charge tous les fichiers .yml depuis /etc/prometheus/rules/
    # Ce dossier est monté depuis le ConfigMap "prometheus-alerts" (alerting.yaml)
    rule_files:
      - /etc/prometheus/rules/*.yml

    # ── AlertManager ───────────────────────────────────────────────────────────
    # Prometheus envoie les alertes FIRING à AlertManager sur :9093
    # AlertManager les route vers Slack / webhook selon alertmanager.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
              {{- if .Values.alerting.enabled }}
              - alertmanager:9093
              {{- else }}
              []
              {{- end }}

    scrape_configs:
      - job_name: 'traiteur-agent'
        static_configs:
          - targets: ['agent.{{ .Values.namespace }}.svc.cluster.local:8000']
        metrics_path: /metrics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    {{- include "traiteur.selectorLabels" "prometheus" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "traiteur.selectorLabels" "prometheus" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        {{- include "traiteur.selectorLabels" "prometheus" | nindent 8 }}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.monitoring.prometheus.retention }}"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
            {{- if .Values.monitoring.prometheus.enabled }}
            # Règles d'alerte (depuis ConfigMap "prometheus-alerts" dans alerting.yaml)
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
        {{- if .Values.monitoring.prometheus.enabled }}
        - name: rules
          configMap:
            name: prometheus-alerts
        {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "traiteur.selectorLabels" "prometheus" | nindent 4 }}
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
{{- end }}

---
{{- if .Values.monitoring.grafana.enabled }}
# ── Grafana ───────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus.{{ .Values.namespace }}.svc.cluster.local:9090
        isDefault: true
        editable: true
      {{- if .Values.tracing.jaeger.enabled }}
      - name: Jaeger
        type: jaeger
        uid: jaeger
        url: http://jaeger.{{ .Values.namespace }}.svc.cluster.local:16686
        editable: true
      {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    {{- include "traiteur.selectorLabels" "grafana" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "traiteur.selectorLabels" "grafana" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        {{- include "traiteur.selectorLabels" "grafana" | nindent 8 }}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.monitoring.grafana.adminPassword | quote }}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "traiteur.selectorLabels" "grafana" | nindent 4 }}
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30031
{{- end }}
