# ─────────────────────────────────────────────────────────────────────────────
# Provisioning Grafana — Datasources Prometheus + Jaeger
# Étape 10 : Traces distribuées (Jaeger ajouté)
#
# Ce fichier configure automatiquement la datasource Prometheus dans Grafana
# au démarrage du conteneur. Sans ce fichier, il faudrait créer la datasource
# manuellement dans l'interface Grafana à chaque redémarrage.
#
# IMPORTANT : l'uid "prometheus" est FIXE.
# Si Grafana génère un uid aléatoire, tous les panels du dashboard perdent
# leur source et affichent "No data". L'uid fixe garantit que les dashboards
# JSON fonctionnent immédiatement sans modification.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # UID FIXE — référencé dans vocal_agent.json pour que les panels trouvent la source
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      # Prometheus 2.x supporte le query browser avancé
      prometheusType: Prometheus
      # Cache les labels pendant 5 minutes (performance)
      cacheLevel: High

  # ── Jaeger — Traces distribuées (étape 10) ──────────────────────────────────
  # Permet d'explorer les traces depuis Grafana (Explore → Jaeger).
  # On peut aussi créer des panels Grafana qui affichent des traces
  # en corrélation avec les métriques Prometheus.
  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    access: proxy
    isDefault: false
    editable: false
    jsonData:
      # Corrélation Prometheus ↔ Jaeger :
      # Quand on clique sur un span dans Jaeger, Grafana peut afficher
      # les métriques Prometheus au même instant.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -1m
        spanEndTimeShift: 1m
