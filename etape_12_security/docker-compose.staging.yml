version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# TRAITEUR DUPONT — Environnement Staging
# Étape 06 : Staging vs Production
#
# Ce fichier s'utilise EN COMPLÉMENT de docker-compose.yml (production) :
#
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml \
#     up -d agent-staging
#
# Architecture :
#
#   Production (docker-compose.yml) :
#     agent:8000  → data/ → chroma_data  ← trafic réel
#
#   Staging (ce fichier, en overlay) :
#     agent-staging:8100  → data-staging/ → chroma_staging  ← tests
#
#   Partagé (infrastructure commune) :
#     ollama, stt-router, stt-blue, stt-green, tts
#     → Pas besoin de dupliquer les services lourds (LLM, STT, TTS)
#
# Workflow de promotion :
#   1. Modifier data-staging/ avec les nouvelles données
#   2. make staging-rebuild → rebuild index staging
#   3. make staging-test    → tests automatisés contre staging (port 8100)
#   4. make promote         → copie data-staging/ → data/ + rebuild production
#   5. make test            → vérification finale sur production
#
# POURQUOI UN STAGING SÉPARÉ ?
#   - Tester des changements de données sans risquer la production
#   - Valider que les tests passent AVANT d'impacter les utilisateurs réels
#   - Rollback immédiat possible si quelque chose ne va pas
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Agent Staging ─────────────────────────────────────────────────────────
  # Instance parallèle de l'agent qui utilise data-staging/ au lieu de data/.
  # Partage ollama, stt-router et tts avec la production (services lourds).
  # Index ChromaDB isolé : chroma_staging (ne touche pas à chroma_data).
  agent-staging:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: traiteur_agent_staging
    ports:
      - "8100:8000"   # staging sur 8100, production sur 8000
    depends_on:
      ollama:
        condition: service_healthy
      stt-router:
        condition: service_healthy
      tts:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STT_SERVICE_URL=http://stt-router:8001
      - TTS_SERVICE_URL=http://tts:8002
      - LLM_MODEL=${LLM_MODEL:-mistral}
      - ORDER_COMPLEXITY_THRESHOLD=${ORDER_COMPLEXITY_THRESHOLD:-6}
      - DATA_DIR=/app/data                  # volume monté sur data-staging/
      - ORDERS_DIR=/app/orders
      - CHROMA_DIR=/app/chroma              # volume séparé chroma_staging
      - EVAL_DIR=/app/eval
      - RAG_QUALITY_THRESHOLD=${RAG_QUALITY_THRESHOLD:-0.8}
      - APP_ENV=staging                     # identifiant d'environnement
    volumes:
      - ./data-staging:/app/data:ro         # ← DIFFÉRENCE CLÉ : données staging
      - ./orders-staging:/app/orders
      - chroma_staging:/app/chroma          # ← index ChromaDB isolé
      - ./eval:/app/eval:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

volumes:
  chroma_staging:
    # Volume ChromaDB dédié au staging.
    # Isolé de chroma_data (production) → un rebuild staging ne touche pas production.
