version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# TRAITEUR DUPONT – Agent Vocal IA
# Étape 10 : OpenTelemetry — Traces distribuées avec Jaeger
#
# Nouveautés par rapport à l'étape 02 :
#
#   Avant (étape 02) :
#     agent → stt:8001 (Whisper base)
#
#   Après (étape 03) :
#     agent → stt-router:8001 (nginx) → stt-blue:8001 (base)  [défaut]
#                                     → stt-green:8001 (small) [après switch]
#
# Architecture Blue/Green :
#
#   stt-blue (Whisper base)  ←─┐
#                               ├── stt-router:8001 (nginx) ←── agent
#   stt-green (Whisper small) ←─┘
#
#   Le switch est instantané :
#     make stt-switch-green  →  nginx reload  →  < 100ms  →  zéro downtime
#
# Ports exposés sur la machine hôte :
#   stt-router : 8001  (transparent — même port qu'avant)
#   stt-blue   : 8011  (accès direct pour le benchmark)
#   stt-green  : 8012  (accès direct pour le benchmark)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LLM Local ───────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: traiteur_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── STT Blue — Whisper base (production actuelle) ───────────────────────────
  # C'est l'équivalent du "serveur de production" avant le déploiement.
  # Il tourne en continu et sert les requêtes via stt-router.
  stt-blue:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
      args:
        WHISPER_MODEL: ${WHISPER_MODEL_BLUE:-base}
    container_name: traiteur_stt_blue
    ports:
      - "8011:8001"   # Exposé sur 8011 pour le benchmark (accès direct)
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL_BLUE:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 120s
    restart: unless-stopped

  # ── STT Green — Whisper small (candidat au déploiement) ────────────────────
  # C'est le "nouveau serveur" qu'on prépare en parallèle.
  # Il démarre et se met en veille. Le benchmark l'appelle directement (port 8012).
  # Le switch le mettra en "production" via stt-router.
  stt-green:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
      args:
        WHISPER_MODEL: ${WHISPER_MODEL_GREEN:-small}
    container_name: traiteur_stt_green
    ports:
      - "8012:8001"   # Exposé sur 8012 pour le benchmark (accès direct)
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL_GREEN:-small}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 180s   # small prend plus de temps à charger
    restart: unless-stopped

  # ── STT Router — nginx Blue/Green (point d'entrée unique) ───────────────────
  # L'agent NE SAIT PAS quel modèle est actif. Il parle toujours à stt-router.
  # C'est le router qui décide : blue ou green ?
  # Le switch se fait via `make stt-switch-green` (nginx reload, < 100ms).
  stt-router:
    build:
      context: ./services/stt-router
      dockerfile: Dockerfile
    container_name: traiteur_stt_router
    ports:
      - "8001:8001"   # Même port qu'avant → l'agent externe ne voit pas le changement
    depends_on:
      stt-blue:
        condition: service_healthy
      stt-green:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Text-to-Speech (Piper TTS) ───────────────────────────────────────────────
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
    container_name: traiteur_tts
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── Agent IA (LangGraph + RAG + Métriques) ───────────────────────────────────
  # Seul changement vs étape 02 :
  #   STT_SERVICE_URL pointe vers stt-router (plus vers stt directement)
  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile
    container_name: traiteur_agent
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      stt-router:
        condition: service_healthy
      tts:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - STT_SERVICE_URL=http://stt-router:8001    # ← pointe vers le router
      - TTS_SERVICE_URL=http://tts:8002
      - LLM_MODEL=${LLM_MODEL:-mistral}
      - ORDER_COMPLEXITY_THRESHOLD=${ORDER_COMPLEXITY_THRESHOLD:-6}
      - DATA_DIR=/app/data
      - ORDERS_DIR=/app/orders
      - CHROMA_DIR=/app/chroma
      - EVAL_DIR=/app/eval                        # ← jeu d'évaluation quality gate (étape 05)
      - RAG_QUALITY_THRESHOLD=${RAG_QUALITY_THRESHOLD:-0.8}
      # ── OpenTelemetry (étape 10) ────────────────────────────────────────────
      # OTEL_EXPORTER_OTLP_ENDPOINT : URL du collecteur Jaeger (OTLP gRPC)
      # Le SDK OTel envoie les spans à cette adresse toutes les 1s (BatchSpanProcessor)
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=traiteur-agent
      - OTEL_TRACES_ENABLED=${OTEL_TRACES_ENABLED:-true}
    volumes:
      - ./data:/app/data:ro
      - ./orders:/app/orders
      - ./eval:/app/eval:ro                       # ← rag_quality_eval.json monté en lecture seule
      - chroma_data:/app/chroma
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ── Interface Web ────────────────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: traiteur_ui
    ports:
      - "3000:80"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: traiteur_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

  # ── Jaeger — Backend de traces distribuées (étape 10) ────────────────────────
  #
  # jaegertracing/all-in-one = collecteur + stockage + UI en un seul conteneur.
  # En production on séparerait ces composants, mais pour le TP c'est suffisant.
  #
  # Ports :
  #   16686 → UI Jaeger (http://localhost:16686)
  #   4317  → OTLP gRPC receiver (reçoit les spans de l'agent)
  #   4318  → OTLP HTTP receiver (alternatif à gRPC)
  #
  # Architecture :
  #   agent → BatchSpanProcessor → OTLPSpanExporter → jaeger:4317
  #                                                         ↓
  #                                                   stockage mémoire
  #                                                         ↓
  #                                                   UI :16686
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: traiteur_jaeger
    ports:
      - "16686:16686"   # UI Jaeger — http://localhost:16686
      - "4317:4317"     # OTLP gRPC (reçoit les spans)
      - "4318:4318"     # OTLP HTTP (alternatif)
    environment:
      # Activer le collecteur OTLP (désactivé par défaut dans les anciennes versions)
      - COLLECTOR_OTLP_ENABLED=true
      # Limite mémoire pour le stockage des traces (all-in-one = in-memory)
      - MEMORY_MAX_TRACES=10000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: traiteur_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  ollama_data:
  chroma_data:
  prometheus_data:
  grafana_data:
