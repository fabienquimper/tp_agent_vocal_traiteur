# ─────────────────────────────────────────────────────────────────────────────
# Configuration Prometheus — Agent Vocal Traiteur
# Étape 02 : Observabilité
#
# Prometheus "tire" (scrape) les métriques depuis /metrics toutes les 15 secondes.
# Modèle pull vs push :
#   - Pull (Prometheus) : Prometheus contrôle la fréquence, détecte les services tombés
#   - Push (alternative) : les services envoient eux-mêmes les données (ex : StatsD)
#
# La config "pull" est recommandée pour les microservices Docker car :
#   1. Prometheus voit immédiatement si un service est KO (scrape timeout)
#   2. Pas de couplage entre le service et le système de monitoring
#   3. Cohérence temporelle garantie (tous scrappés à t, t+15s, t+30s…)
# ─────────────────────────────────────────────────────────────────────────────

global:
  # Fréquence de collecte des métriques (toutes les 15 secondes)
  # En prod on descend souvent à 30s ou 60s pour économiser le stockage
  scrape_interval: 15s

  # Fréquence d'évaluation des règles d'alerte (hors scope étape 02)
  evaluation_interval: 15s

  # Labels ajoutés à toutes les métriques (utile si plusieurs environnements)
  external_labels:
    environment: "dev"
    project: "traiteur-dupont"

scrape_configs:

  # ── Agent IA (pipeline STT + LLM + RAG + TTS) ───────────────────────────────
  - job_name: "agent-vocal"
    static_configs:
      - targets: ["agent:8000"]
        labels:
          service: "agent"
    metrics_path: "/metrics"
    scrape_interval: 15s
    # Timeout scrape : si l'agent ne répond pas en 10s, Prometheus marque le scrape KO
    scrape_timeout: 10s

  # ── Prometheus lui-même ────────────────────────────────────────────────────
  # Bonne pratique : monitorer le moniteur !
  # Permet de détecter si Prometheus est surchargé ou manque de mémoire.
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"
