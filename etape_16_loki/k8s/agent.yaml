# ── Deployment — Agent IA avec 2 replicas et HPA ──────────────────────────────
#
# NOUVEAUTÉ K8S vs Docker Compose :
#   Docker Compose : 1 instance de l'agent
#   Kubernetes     : 2 instances par défaut, jusqu'à 5 sous charge (HPA)
#
# Les requêtes utilisateurs sont réparties entre les pods par le Service K8s
# (round-robin par défaut). Chaque pod est identique et stateless.
#
# CHROMADB PAR POD :
#   Chaque pod reconstruit son propre ChromaDB (emptyDir) au démarrage.
#   C'est intentionnel pour la démo : en production, on utiliserait
#   un ChromaDB centralisé (service séparé) ou un vector store managé.
#   Avantage ici : chaque pod est totalement indépendant (stateless).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: traiteur
  labels:
    app: agent
    version: v1
spec:
  replicas: 2   # ← 2 replicas par défaut (le HPA peut monter jusqu'à 5)
  # ── Rolling Update — zéro downtime ──────────────────────────────────────────
  # maxUnavailable: 0 → on ne supprime aucun pod avant qu'un nouveau soit READY
  # maxSurge: 1       → on crée 1 pod supplémentaire pendant la mise à jour
  #
  # Timeline d'un rolling update avec 2 replicas :
  #   t=0  : [v1, v1]         2 pods actifs
  #   t=10 : [v1, v1, v2]     1 pod v2 en cours de démarrage (surge)
  #   t=90 : [v1, v1, v2✓]    v2 est READY
  #   t=91 : [v1, v2✓]        1 pod v1 supprimé
  #   t=100: [v1, v2✓, v2]    nouveau pod v2 en cours
  #   t=190: [v2✓, v2✓]       rolling update terminé, zéro downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        version: v1
    spec:
      # ── ServiceAccount (étape 12 — RBAC) ──────────────────────────────────
      # Remplace le SA "default" (trop permissif) par un SA minimal.
      # agent-sa peut uniquement lire les ConfigMaps (défini dans rbac/rbac.yaml).
      serviceAccountName: agent-sa
      # automountServiceAccountToken: false serait encore plus sécurisé si
      # l'agent n'a pas besoin d'appeler l'API K8s. On le garde à true
      # pour permettre `kubectl auth can-i` dans les démos.
      containers:
        - name: agent
          image: traiteur-agent:latest
          imagePullPolicy: Never   # image chargée via kind load
          ports:
            - containerPort: 8000
          # Toutes les env vars depuis le ConfigMap traiteur-config
          envFrom:
            - configMapRef:
                name: traiteur-config
          volumeMounts:
            # data/ et eval/ depuis ConfigMaps (lecture seule)
            - name: data-vol
              mountPath: /app/data
              readOnly: true
            - name: eval-vol
              mountPath: /app/eval
              readOnly: true
            # chroma et orders : emptyDir (local à chaque pod, rebuilt au démarrage)
            - name: chroma-vol
              mountPath: /app/chroma
            - name: orders-vol
              mountPath: /app/orders
          # ── Resource Requests — OBLIGATOIRE pour le HPA ────────────────────
          # Le HPA calcule : CPU utilisé / CPU request = utilisation %
          # Si utilisation > 50% → scale out
          resources:
            requests:
              cpu: "200m"     # 0.2 core — base pour le calcul HPA
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # ── Probes ────────────────────────────────────────────────────────
          # readinessProbe : le pod ne reçoit du trafic que quand il est READY
          # livenessProbe  : K8s redémarre le pod s'il ne répond plus
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90   # ChromaDB rebuild ≈ 30-60s
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data-vol
          configMap:
            name: traiteur-data    # kubectl create configmap traiteur-data --from-file=data/
        - name: eval-vol
          configMap:
            name: traiteur-eval    # kubectl create configmap traiteur-eval --from-file=eval/
        - name: chroma-vol
          emptyDir: {}
        - name: orders-vol
          emptyDir: {}

---
# ── Service NodePort — accès depuis localhost:8000 ────────────────────────────
# Le Service distribue le trafic entre tous les pods de l'agent (round-robin).
# Chaque requête peut aller vers un pod différent.
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: traiteur
spec:
  type: NodePort
  selector:
    app: agent
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000   # → localhost:8000 via kind port-mapping

---
# ── HorizontalPodAutoscaler ────────────────────────────────────────────────────
#
# Le HPA surveille le CPU moyen de tous les pods "agent" toutes les 15s.
# Si le CPU moyen dépasse 50% des requests → il ajoute des pods.
# Si le CPU redescend → il retire des pods (après un délai de stabilisation).
#
# Formule de scaling :
#   desired_replicas = ceil(current_replicas × (current_cpu / target_cpu))
#   Exemple : 2 pods × (80% / 50%) = ceil(3.2) = 4 pods
#
# Prérequis : metrics-server doit être installé dans le cluster.
#   Vérification : kubectl top pods -n traiteur
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agent-hpa
  namespace: traiteur
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agent
  minReplicas: 2   # Toujours au moins 2 pods (haute disponibilité)
  maxReplicas: 5   # Jamais plus de 5 pods
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50   # Scale up si CPU moyen > 50% des requests
  behavior:
    scaleUp:
      # Attends 30s avant de scale up (évite les faux positifs sur pics courts)
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1          # Ajoute max 1 pod par intervalle
          periodSeconds: 30
    scaleDown:
      # Attends 2 minutes avant de scale down (évite le "flapping")
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1          # Retire max 1 pod par intervalle
          periodSeconds: 60
