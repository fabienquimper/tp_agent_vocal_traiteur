# ── PersistentVolumeClaim — stockage des modèles Ollama ───────────────────────
# Les modèles LLM sont volumineux (~4 GB pour Mistral 7B).
# On les stocke sur un volume persistant pour éviter de les re-télécharger
# à chaque redémarrage du pod.
#
# kind utilise le provisioner "rancher.io/local-path" par défaut.
# Le volume est créé automatiquement dès qu'un pod le réclame.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: traiteur
spec:
  accessModes:
    - ReadWriteOnce   # Un seul pod peut écrire à la fois (suffisant pour 1 replica)
  resources:
    requests:
      storage: 10Gi   # Mistral 7B ≈ 4 GB — de la marge pour d'autres modèles

---
# ── Deployment ────────────────────────────────────────────────────────────────
# Ollama = 1 replica (le LLM local n'est pas scalable facilement, GPU requis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: traiteur
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent   # utilise l'image locale si disponible
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          readinessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["ollama", "list"]
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models

---
# ── Service ClusterIP — accès interne (agent → ollama) ────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: traiteur
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434

---
# ── Service NodePort — accès depuis l'hôte (pour make k8s-init-ollama) ────────
apiVersion: v1
kind: Service
metadata:
  name: ollama-external
  namespace: traiteur
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 30434   # → localhost:11434 via kind port-mapping
