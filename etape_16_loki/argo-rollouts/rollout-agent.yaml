# ─────────────────────────────────────────────────────────────────────────────
# rollout-agent.yaml — Rollout Argo (remplace le Deployment K8s de l'agent)
# Étape 15 : Argo Rollouts
#
# Un Rollout est presque identique à un Deployment, avec 2 différences :
#   1. apiVersion: argoproj.io/v1alpha1 / kind: Rollout
#   2. spec.strategy = canary (au lieu de RollingUpdate / Recreate)
#
# Stratégie canary avec analyse automatique :
#
#   Nouvelle image disponible
#        │
#        ▼
#   setWeight: 20%    → 20% des pods reçoivent la nouvelle image
#        │
#        ▼
#   pause: 60s        → attendre que les métriques se stabilisent
#        │
#        ▼
#   analysis          → interroger Prometheus (availability + error-rate)
#        │            → si échec → rollback automatique
#        ▼
#   setWeight: 50%
#        │
#        ▼
#   pause + analysis
#        │
#        ▼
#   setWeight: 80%
#        │
#        ▼
#   pause + analysis
#        │
#        ▼
#   Promotion automatique → 100% nouvelle image
#
# Comparaison avec étape 11 (canary NGINX manuel) :
#   Avant : scripts/canary-promote.sh boucle 10→20→40→80→100%
#           Décision humaine à chaque étape
#   Après : Argo Rollouts fait tout automatiquement
#           Décision basée sur les métriques Prometheus
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: agent
  namespace: traiteur
  labels:
    app: agent
spec:
  replicas: 2

  selector:
    matchLabels:
      app: agent

  # ── Stratégie canary ────────────────────────────────────────────────────────
  # Note : le Service existant "agent" continue de fonctionner.
  # Argo Rollouts utilise la même sélection de pods (app: agent) et gère
  # le versioning en interne via les ReplicaSets.
  strategy:
    canary:
      # Étapes du déploiement progressif
      # Chaque étape est exécutée dans l'ordre après un changement d'image.
      # Un seul rollback annule toutes les étapes et revient à la version stable.
      steps:
        # ── Étape 1 : 20% des pods en canary ──────────────────────────────────
        - setWeight: 20
        # ── Étape 2 : attendre la stabilisation des métriques (1 min) ─────────
        - pause: {duration: 60s}
        # ── Étape 3 : analyser les métriques Prometheus ────────────────────────
        # Crée un AnalysisRun depuis l'AnalysisTemplate "traiteur-availability"
        # Si availability < 0.99 OU error-rate > 5% → rollback automatique
        - analysis:
            templates:
              - templateName: traiteur-availability

        # ── Étape 4 : monter à 50% ────────────────────────────────────────────
        - setWeight: 50
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: traiteur-availability

        # ── Étape 5 : monter à 80% ────────────────────────────────────────────
        - setWeight: 80
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: traiteur-availability

        # Après toutes les étapes → promotion automatique à 100%
        # (pas de étape "setWeight: 100" nécessaire — c'est la valeur par défaut)

  # ── Pod template (identique au Deployment étape 13/14) ─────────────────────
  template:
    metadata:
      labels:
        app: agent
    spec:
      serviceAccountName: agent-sa
      containers:
        - name: agent
          image: traiteur-agent:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: traiteur-config
          env:
            - name: APP_ENV
              value: "production"
            - name: RAG_QUALITY_THRESHOLD
              value: "0.8"
            - name: ORDER_COMPLEXITY_THRESHOLD
              value: "6"
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: OTEL_TRACES_ENABLED
              value: "true"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
            - name: OTEL_SERVICE_NAME
              value: "traiteur-agent"
          volumeMounts:
            - name: data-vol
              mountPath: /app/data
              readOnly: true
            - name: eval-vol
              mountPath: /app/eval
              readOnly: true
            - name: chroma-vol
              mountPath: /app/chroma
            - name: orders-vol
              mountPath: /app/orders
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: data-vol
          configMap:
            name: traiteur-data
        - name: eval-vol
          configMap:
            name: traiteur-eval
        - name: chroma-vol
          emptyDir: {}
        - name: orders-vol
          emptyDir: {}
