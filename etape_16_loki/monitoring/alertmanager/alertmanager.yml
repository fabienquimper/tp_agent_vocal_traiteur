# ─────────────────────────────────────────────────────────────────────────────
# alertmanager.yml — Configuration AlertManager (docker-compose local)
# Étape 14 : SLOs & Alerting
#
# AlertManager reçoit les alertes de Prometheus et les route vers des receivers.
# Il gère :
#   - Le groupement (évite le spam : 100 alertes → 1 notif groupée)
#   - Les silences (maintenance planifiée → pas de notif pendant 2h)
#   - Les inhibitions (si l'agent est down, supprimer les alertes RAG/LLM)
#   - Le repeat_interval (re-notifie si l'alerte est toujours active)
#
# En local : les alertes sont envoyées au webhook local (localhost:5001)
# Pour activer Slack : remplacer VOTRE_WEBHOOK_SLACK_URL
# ─────────────────────────────────────────────────────────────────────────────

global:
  resolve_timeout: 5m

# ── Arbre de routage ──────────────────────────────────────────────────────────
route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'webhook-local'

  routes:
    # Alertes critiques → notif immédiate
    - matchers:
        - severity = "critical"
      receiver: 'webhook-critical'
      group_wait: 10s    # pas d'attente pour les critiques

    # Alertes SLO → canal dédié
    - matchers:
        - slo =~ ".+"
      receiver: 'webhook-slo'

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  # Webhook local — pour tests (scripts/alert-demo.sh démarre un serveur sur :5001)
  - name: 'webhook-local'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/alerts'
        send_resolved: true

  - name: 'webhook-critical'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/critical'
        send_resolved: true

  - name: 'webhook-slo'
    webhook_configs:
      - url: 'http://host.docker.internal:5001/slo'
        send_resolved: true

  # Slack — décommenter et remplacer l'URL pour activer
  # - name: 'slack-alertes'
  #   slack_configs:
  #     - api_url: 'VOTRE_WEBHOOK_SLACK_URL'
  #       channel: '#alertes-traiteur'
  #       title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
  #       text: >-
  #         {{ range .Alerts }}
  #         *Alert:* {{ .Labels.alertname }}
  #         *Severity:* {{ .Labels.severity }}
  #         *Description:* {{ .Annotations.description }}
  #         {{ end }}
  #       send_resolved: true

# ── Inhibitions ───────────────────────────────────────────────────────────────
# Si l'agent est complètement down → supprimer les alertes "warning" dérivées
# (RAG hit rate low, LLM errors) : elles sont des effets secondaires.
inhibit_rules:
  - source_matchers:
      - alertname = "TraiteurAgentDown"
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: []
