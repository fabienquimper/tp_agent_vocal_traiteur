{{/*
loki.yaml — Loki (logs) + Promtail (collecteur)
Étape 16 : les 3 piliers de l'observabilité

Les 3 piliers :
  Métriques  → Prometheus  (étape 02) : "combien ?"
  Traces     → Jaeger/OTel (étape 10) : "pourquoi est-ce lent ?"
  Logs       → Loki        (étape 16) : "qu'est-ce qui s'est passé exactement ?"

Loki vs Elasticsearch :
  Elasticsearch : indexe le CONTENU des logs (lourd, cher)
  Loki          : indexe seulement les LABELS (app, namespace, pod...)
                  → 10× moins de ressources, même puissance de recherche

Architecture :
  [Pods K8s] → [Promtail DaemonSet] → [Loki] ← [Grafana]
                (lit /var/log/pods)   (stocke)   (affiche + corrèle)

Corrélation Logs ↔ Traces (killer feature) :
  Dans les logs : "trace_id=abc123"
  Dans Grafana  : cliquer sur l'ID → aller directement dans Jaeger
  C'est ce que font les "derived fields" dans la datasource Grafana.

Conditionnels :
  {{ if .Values.loki.enabled }}     → Loki Deployment + Service
  {{ if .Values.promtail.enabled }} → Promtail DaemonSet + RBAC
*/}}

{{- if .Values.loki.enabled }}
# ── Loki — Configuration ──────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
data:
  loki.yml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2023-01-01"
          store: tsdb
          object_store: filesystem
          schema: v12
          index:
            prefix: index_
            period: 24h

    ruler:
      alertmanager_url: http://localhost:9093

    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      # Limites généreuses pour le dev local
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32

---
# ── Loki Deployment ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    {{- include "traiteur.selectorLabels" "loki" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "traiteur.selectorLabels" "loki" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        {{- include "traiteur.selectorLabels" "loki" | nindent 8 }}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yml
          ports:
            - containerPort: 3100
              name: http
            - containerPort: 9096
              name: grpc
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}

---
# ── Service ClusterIP — Promtail → Loki ───────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "traiteur.selectorLabels" "loki" | nindent 4 }}
  ports:
    - name: http
      port: 3100
      targetPort: 3100
    - name: grpc
      port: 9096
      targetPort: 9096
{{- end }}

{{- if .Values.promtail.enabled }}
---
# ── Promtail RBAC — lire les métadonnées des pods ────────────────────────────
{{/*
Promtail a besoin de lire les métadonnées des pods pour enrichir les logs
avec des labels (app, namespace, pod, container).
C'est un ClusterRole car il doit lire dans TOUS les namespaces.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail-cluster-role
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail-cluster-rolebinding
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: promtail-sa
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: promtail-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
# ── Promtail Configuration ────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.{{ .Values.namespace }}.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      # ── Logs des pods K8s ────────────────────────────────────────────────────
      # Promtail lit les logs depuis /var/log/pods/* sur chaque nœud
      # et les enrichit avec les labels des pods (app, namespace, etc.)
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          # Essayer de parser les logs JSON (FastAPI les émet en JSON)
          - json:
              expressions:
                level: level
                msg: msg
                trace_id: trace_id   # OTel trace ID (étape 10)
          # Ajouter le level comme label (pour filtrer par niveau de log)
          - labels:
              level:
          # Extraire le trace_id comme label structuré
          - labels:
              trace_id:
        relabel_configs:
          # Garder seulement les pods du namespace traiteur
          - source_labels: [__meta_kubernetes_namespace]
            regex: {{ .Values.namespace }}
            action: keep
          # Labels utiles pour la recherche dans Grafana
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          # Path du fichier de log sur le nœud
          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*/*$1/*.log

---
# ── Promtail DaemonSet — un pod par nœud ──────────────────────────────────────
{{/*
DaemonSet = Kubernetes garantit qu'un pod Promtail tourne sur CHAQUE nœud.
Ainsi, tous les logs de tous les pods sont collectés, quel que soit le nœud.

En production avec plusieurs nœuds :
  nœud-1 : pod agent → promtail-1 lit ses logs
  nœud-2 : pod stt   → promtail-2 lit ses logs
  tous → Loki central

Ici en kind (1 nœud) : 1 seul pod Promtail lit tout.
*/}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    {{- include "traiteur.selectorLabels" "promtail" | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "traiteur.selectorLabels" "promtail" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        {{- include "traiteur.selectorLabels" "promtail" | nindent 8 }}
    spec:
      serviceAccountName: promtail-sa
      tolerations:
        # Promtail doit tourner sur TOUS les nœuds, même les control-plane
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/promtail/promtail.yml
          ports:
            - containerPort: 9080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: promtail-config
        # Logs des pods K8s sur le nœud hôte
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        # Logs Docker (fallback)
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
{{- end }}
