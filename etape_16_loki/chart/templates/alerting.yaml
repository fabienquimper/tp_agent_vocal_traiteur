{{/*
alerting.yaml — Règles d'alerte Prometheus + AlertManager
Étape 14 : SLOs & Alerting

Deux blocs conditionnels indépendants :
  1. prometheus-alerts ConfigMap   → {{ if .Values.monitoring.prometheus.enabled }}
     Contient les règles PromQL qui définissent les alertes.
     Monté dans le pod Prometheus via un volume (voir monitoring.yaml).

  2. AlertManager                  → {{ if .Values.alerting.enabled }}
     Reçoit les alertes de Prometheus, les route et les envoie
     vers Slack / webhook / email selon la configuration.

Architecture :
  [Prometheus] ──évalue les règles──▶ [AlertManager] ──route──▶ [Slack / webhook]
                 (toutes les 15s)      (reçoit sur :9093)         (notif humaine)

Vocabulaire :
  SLI (Service Level Indicator) : la métrique mesurée
    ex. taux de succès des conversations

  SLO (Service Level Objective) : l'objectif à respecter
    ex. SLI ≥ 0.99 sur 30 jours

  Error Budget : ce qui reste avant violation du SLO
    ex. 432 minutes d'erreurs autorisées par mois (1% × 30d × 24h × 60m)

  Burn Rate : à quelle vitesse on consomme le budget d'erreurs
    ex. burn rate 14× = budget épuisé en ~2h
*/}}

{{- if .Values.monitoring.prometheus.enabled }}
# ── Règles d'alerte Prometheus ────────────────────────────────────────────────
{{/*
Ce ConfigMap est monté dans le pod Prometheus à /etc/prometheus/rules/
grâce au volume "rules" défini dans monitoring.yaml (Prometheus Deployment).

Prometheus évalue ces règles toutes les 15 secondes (evaluation_interval).
Quand une condition est vraie pendant la durée "for:", l'alerte passe FIRING.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
data:
  traiteur.yml: |
    # ────────────────────────────────────────────────────────────────────────────
    # Règles d'alerte — Traiteur Dupont Agent Vocal
    # Étape 14 : SLOs & Alerting
    # ────────────────────────────────────────────────────────────────────────────

    groups:

      # ── Groupe 1 : SLOs (Service Level Objectives) ───────────────────────────
      # Ces alertes sont les plus importantes : elles mesurent l'expérience réelle
      # des utilisateurs. Un SLO violé = un engagement non tenu.
      #
      # SLO Disponibilité : {{ .Values.slos.availability.target }} des conversations réussissent
      # SLO Latence       : P95 < {{ .Values.slos.latency.p95TargetSeconds }}s

      - name: traiteur.slo
        rules:

          # ── SLO Disponibilité ─────────────────────────────────────────────────
          # SLI : taux de succès = conversations ok / total conversations
          # SLO : ce ratio doit être ≥ {{ .Values.slos.availability.target }}
          #
          # "for: 5m" = l'alerte ne se déclenche que si le SLO est violé
          # PENDANT 5 minutes consécutives (pas de faux positifs sur 1 spike)
          - alert: TraiteurAvailabilitySLOViolation
            expr: |
              (
                sum(rate(conversations_total{status="success"}[5m]))
                /
                sum(rate(conversations_total[5m]))
              ) < {{ .Values.slos.availability.target }}
            for: 5m
            labels:
              severity: critical
              slo: availability
              team: traiteur
            annotations:
              summary: "SLO disponibilité violé (< {{ .Values.slos.availability.target }})"
              description: |
                Taux de succès actuel : {{ "{{ $value | humanizePercentage }}" }}
                SLO cible : {{ .Values.slos.availability.target }}
                Error budget consommé trop vite.
              runbook: |
                1. kubectl logs -n {{ .Values.namespace }} deploy/agent --tail=50
                2. curl http://localhost:8000/health
                3. Vérifier Ollama : kubectl logs -n {{ .Values.namespace }} deploy/ollama

          # ── Error Budget Burn Rate ────────────────────────────────────────────
          # Si on brûle le budget d'erreurs 14× plus vite que la normale,
          # on va l'épuiser en ~2 heures → alerte AVANT la violation SLO.
          #
          # Calcul :
          #   Budget mensuel = (1 - SLO) = {{ mulf 1.0 (float64 (sub 1.0 (float64 .Values.slos.availability.target | atoi))) | default "0.01" }}
          #   Burn rate 14× = on consomme en 2h ce qu'on devrait consommer en 30j
          #
          # C'est l'alerte la plus utile en pratique : elle prévient AVANT la crise.
          - alert: TraiteurErrorBudgetBurnRateHigh
            expr: |
              (
                sum(rate(conversations_total{status="error"}[1h]))
                /
                sum(rate(conversations_total[1h]))
              ) > (1 - {{ .Values.slos.availability.target }}) * 14.4
            for: 2m
            labels:
              severity: critical
              slo: availability
              team: traiteur
            annotations:
              summary: "Error budget épuisé en < 2h si ça continue"
              description: |
                Burn rate actuel : {{ "{{ $value | humanize }}" }}×
                À ce rythme, l'error budget sera épuisé en moins de 2 heures.
              runbook: |
                Vérifier immédiatement les erreurs LLM et RAG.

          # ── SLO Latence P95 ───────────────────────────────────────────────────
          # P95 = 95% des conversations sont traitées en moins de cette durée.
          # Si P95 > seuil : trop de clients attendent trop longtemps.
          - alert: TraiteurLatencySLOViolation
            expr: |
              histogram_quantile(0.95,
                sum(rate(conversation_duration_seconds_bucket[5m])) by (le)
              ) > {{ .Values.slos.latency.p95TargetSeconds }}
            for: 5m
            labels:
              severity: warning
              slo: latency
              team: traiteur
            annotations:
              summary: "SLO latence violé (P95 > {{ .Values.slos.latency.p95TargetSeconds }}s)"
              description: |
                P95 actuel : {{ "{{ $value | humanizeDuration }}" }}
                SLO cible  : {{ .Values.slos.latency.p95TargetSeconds }}s
              runbook: |
                Vérifier la latence LLM :
                  curl http://localhost:8000/metrics | grep llm_generate_latency

      # ── Groupe 2 : Composants (alertes techniques) ───────────────────────────
      # Ces alertes pointent vers un composant spécifique (agent, STT, LLM...).
      # Elles aident à diagnostiquer POURQUOI un SLO est violé.

      - name: traiteur.components
        rules:

          # L'agent ne répond plus à Prometheus (scrape échoue)
          - alert: TraiteurAgentDown
            expr: up{job="traiteur-agent"} == 0
            for: 1m
            labels:
              severity: critical
              component: agent
            annotations:
              summary: "Agent IA indisponible"
              description: "Prometheus ne peut pas scraper l'agent depuis 1 minute."
              runbook: |
                kubectl get pods -n {{ .Values.namespace }} -l app=agent
                kubectl describe pod -n {{ .Values.namespace }} -l app=agent

          # Le LLM génère beaucoup d'erreurs (Ollama surchargé / OOM)
          - alert: TraiteurLLMHighErrorRate
            expr: |
              sum(rate(llm_generate_requests_total{status="error"}[5m]))
              /
              sum(rate(llm_generate_requests_total[5m]))
              > 0.05
            for: 3m
            labels:
              severity: warning
              component: llm
            annotations:
              summary: "Taux d'erreur LLM > 5%"
              description: "Vérifier Ollama : kubectl logs -n {{ .Values.namespace }} deploy/ollama"

          # Le STT génère beaucoup d'erreurs
          - alert: TraiteurSTTHighErrorRate
            expr: |
              sum(rate(stt_requests_total{status="error"}[5m]))
              /
              sum(rate(stt_requests_total[5m]))
              > 0.10
            for: 3m
            labels:
              severity: warning
              component: stt
            annotations:
              summary: "Taux d'erreur STT > 10%"
              description: |
                Couleur STT active : {{ .Values.stt.activeColor }}
                kubectl logs -n {{ .Values.namespace }} deploy/stt-{{ .Values.stt.activeColor }}

      # ── Groupe 3 : RAG (qualité des données) ─────────────────────────────────
      # Ces alertes mesurent la qualité du RAG, pas la disponibilité du service.
      # Un RAG dégradé ne fait pas planter l'agent mais dégrade ses réponses.

      - name: traiteur.rag
        rules:

          # Hit rate RAG trop bas → l'agent répond sans contexte
          - alert: TraiteurRAGHitRateLow
            expr: |
              sum(rate(rag_requests_total{result="hit"}[10m]))
              /
              sum(rate(rag_requests_total[10m]))
              < {{ .Values.slos.ragHitRate.target }}
            for: 10m
            labels:
              severity: warning
              component: rag
            annotations:
              summary: "Hit rate RAG < {{ .Values.slos.ragHitRate.target }}"
              description: |
                Le RAG ne trouve pas de contexte pertinent pour {{ "{{ $value | humanizePercentage }}" }} des requêtes.
                Déclencher un rebuild : curl -X POST http://agent:8000/api/rag/rebuild
              runbook: |
                make k8s-rag-rebuild
                make k8s-rag-status

          # Les quality gates échouent systématiquement
          - alert: TraiteurRAGQualityGateFailing
            expr: |
              sum(rate(rag_quality_gate_total{result="failed"}[30m]))
              /
              sum(rate(rag_quality_gate_total[30m]))
              > 0.5
            for: 15m
            labels:
              severity: warning
              component: rag
            annotations:
              summary: "Plus de 50% des quality gates RAG échouent"
              description: "Les données source sont peut-être corrompues ou mal formatées."
{{- end }}

{{- if .Values.alerting.enabled }}
---
# ── AlertManager — configuration ──────────────────────────────────────────────
{{/*
AlertManager reçoit les alertes de Prometheus et les route vers les receivers.

Concepts clés :
  group_by     : regroupe les alertes similaires en 1 seule notif (évite le spam)
  group_wait   : attend 30s pour regrouper les nouvelles alertes
  repeat_interval : re-notifie si l'alerte est toujours active après 4h
  inhibit_rules : si une alerte "critical" fire, supprime les "warning" associées
                 (évite de recevoir 2 notifs pour la même cause)
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # ── Arbre de routage ─────────────────────────────────────────────────────────
    # Les alertes descendent cet arbre jusqu'à trouver un receiver.
    route:
      group_by: ['alertname', 'severity', 'component']
      group_wait: 30s          # attend 30s pour grouper les nouvelles alertes
      group_interval: 5m       # 5m entre 2 groupes du même groupe
      repeat_interval: 4h      # re-notifie après 4h si toujours active
      receiver: 'webhook-default'

      routes:
        # Alertes critiques → receiver dédié (peut être Slack #alertes-urgentes)
        - matchers:
            - severity = "critical"
          receiver: 'webhook-critical'
          continue: true   # continue vers le receiver parent aussi

        # Alertes SLO → receiver dédié (peut être Slack #slo-alerts)
        - matchers:
            - slo =~ ".+"
          receiver: 'webhook-slo'

    # ── Receivers ────────────────────────────────────────────────────────────────
    # Un receiver = une destination de notification.
    # Pour les tests en local : utiliser le webhook local (scripts/alert-demo.sh)
    # Pour la production : remplacer par Slack, PagerDuty, etc.
    receivers:
      - name: 'webhook-default'
        webhook_configs:
          - url: '{{ .Values.alerting.webhookUrl }}'
            send_resolved: true
            http_config:
              follow_redirects: true

      - name: 'webhook-critical'
        webhook_configs:
          - url: '{{ .Values.alerting.webhookUrl }}'
            send_resolved: true
      {{- if .Values.alerting.slack.enabled }}
        slack_configs:
          - api_url: {{ .Values.alerting.slack.webhookUrl | quote }}
            channel: {{ .Values.alerting.slack.channel | quote }}
            title: '[{{ "{{ .Status | toUpper }}" }}] {{ "{{ .CommonLabels.alertname }}" }}'
            text: >-
              {{ "{{ range .Alerts }}" }}
              *Alert:* {{ "{{ .Labels.alertname }}" }}
              *Severity:* {{ "{{ .Labels.severity }}" }}
              *Description:* {{ "{{ .Annotations.description }}" }}
              {{ "{{ end }}" }}
            send_resolved: true
      {{- end }}

      - name: 'webhook-slo'
        webhook_configs:
          - url: '{{ .Values.alerting.webhookUrl }}'
            send_resolved: true

    # ── Règles d'inhibition ───────────────────────────────────────────────────────
    # Si TraiteurAgentDown est firing → supprimer les alertes warning sur l'agent.
    # Raison : si l'agent est down, les alertes sur le RAG/LLM sont des faux positifs.
    inhibit_rules:
      - source_matchers:
          - severity = "critical"
          - alertname = "TraiteurAgentDown"
        target_matchers:
          - severity = "warning"
        equal: ['namespace']

---
# ── AlertManager Deployment ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
    {{- include "traiteur.selectorLabels" "alertmanager" | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "traiteur.selectorLabels" "alertmanager" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traiteur.labels" . | nindent 8 }}
        {{- include "traiteur.selectorLabels" "alertmanager" | nindent 8 }}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=http://localhost:9093"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}

---
# ── Service ClusterIP — Prometheus → AlertManager ─────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "traiteur.selectorLabels" "alertmanager" | nindent 4 }}
  ports:
    - port: 9093
      targetPort: 9093

---
# ── Service NodePort — UI AlertManager accessible depuis l'hôte ───────────────
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-external
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traiteur.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "traiteur.selectorLabels" "alertmanager" | nindent 4 }}
  ports:
    - port: 9093
      targetPort: 9093
      nodePort: 30093
{{- end }}
