# ─────────────────────────────────────────────────────────────────────────────
# OVERRIDE DEV – rechargement à chaud sans rebuild Docker
#
# Docker Compose fusionne automatiquement ce fichier avec docker-compose.yml.
# Aucune commande spéciale : docker compose up suffit.
#
# Ce que ça apporte :
#   - src/ et ui/ montés en volume → les modifications sont visibles immédiatement
#   - uvicorn --reload → redémarre automatiquement dès qu'un fichier src/ change
#
# Pour revenir au comportement prod (image figée) :
#   docker compose -f docker-compose.yml up --build
# ─────────────────────────────────────────────────────────────────────────────

services:
  agent:
    volumes:
      - ./orders:/app/orders
      - ./src:/app/src
      - ./ui:/app/ui
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
