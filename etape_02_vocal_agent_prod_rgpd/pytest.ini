[pytest]
# --- CONFIGURATION ASYNCIO (Pour les tests avec des fonctions async/await) ---

# Détecte automatiquement les tests asynchrones sans avoir à ajouter de décorateur
asyncio_mode = auto

# Crée une boucle d'événements isolée pour CHAQUE test (évite les effets de bord)
asyncio_default_fixture_loop_scope = function
markers =
    slow: tests nécessitant des appels LLM réels (désactivés par défaut en CI)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestDeprecationWarning
