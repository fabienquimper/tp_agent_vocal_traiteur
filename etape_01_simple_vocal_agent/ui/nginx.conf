server {
    listen 80;
    server_name _;

    # Interface statique
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le service agent (évite les problèmes CORS côté navigateur)
    location /api/ {
        proxy_pass         http://agent:8000/api/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        client_max_body_size 50M;    # Fichiers audio jusqu'à 50 MB
        proxy_read_timeout 120s;     # Timeout LLM (peut être lent au premier appel)
    }
}
